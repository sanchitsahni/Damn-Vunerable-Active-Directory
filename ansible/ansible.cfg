# ==============================================================================
# EMPIRE lab — Ansible configuration
# Loaded automatically when ansible-playbook runs from this directory
# (deploy.py invokes ansible with cwd = ansible/).
# ==============================================================================
[defaults]
# Roles live in ansible/roles, but the playbook is in ansible/playbooks/.
# Without this, ansible only searches <playbook_dir>/roles and fails to find
# ad_domain, child_domain, vuln_* etc.
roles_path           = ./roles
inventory            = ./inventory.yml
host_key_checking    = False
retry_files_enabled  = False
# Log every run to ansible/ansible.log (relative to cwd = ansible/) so fatal/
# failed tasks survive terminal scrollback. grep 'fatal:' ansible.log after a run.
log_path             = ./ansible.log
stdout_callback      = default
result_format        = yaml

# ── SPEED ──────────────────────────────────────────────────────────────────
# 'free' strategy: hosts run independently and never wait at a per-task barrier,
# so the 4 DCs / member servers provision in parallel instead of lock-step. This
# is the single biggest win for a multi-host WinRM lab.
strategy             = free
# Enough forks to run every host at once (9 VMs + headroom).
forks                = 20
# Skip slow Windows fact gathering unless a play opts in.
gathering            = explicit
# Cache facts so re-runs don't re-collect them.
fact_caching             = jsonfile
fact_caching_connection  = /tmp/empire-ansible-facts
fact_caching_timeout     = 7200
display_skipped_hosts = False
interpreter_python   = auto_silent
timeout              = 60

[ssh_connection]
# Linux member (linux01) only — pipelining cuts SSH round-trips ~3x.
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey

