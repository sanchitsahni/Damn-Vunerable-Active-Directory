# ==============================================================================
# DUNDER lab — Ansible configuration
# Loaded automatically when ansible-playbook runs from this directory
# (deploy.py invokes ansible with cwd = ansible/).
# ==============================================================================
[defaults]
# Roles live in ansible/roles, but the playbook is in ansible/playbooks/.
# Without this, ansible only searches <playbook_dir>/roles and fails to find
# ad_domain, child_domain, vuln_* etc.
roles_path           = ./roles
inventory            = ./inventory.yml
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = yaml
# Windows targets gather facts slowly; let plays opt in explicitly instead.
gathering            = explicit
# Fail fast and show the full task path on error.
display_skipped_hosts = False
interpreter_python   = auto_silent
forks                = 10

[ssh_connection]
# Not used for WinRM hosts, but harmless defaults for any *nix attacker box.
pipelining = True

[winrm]
# (placeholder section — connection vars are set in inventory.yml)
