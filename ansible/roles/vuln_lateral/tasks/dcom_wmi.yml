          $trigger = New-ScheduledTaskTrigger -Once -At "00:01"
          Register-ScheduledTask -Action $action -Trigger $trigger -TaskName "Lat" \
            -RunLevel Highest -Force -CimSession $(cimSession)

    - path: 'C:\Flags\FLAG-LAT-095-NamedPipe.txt'
      content: |
        LAT-095..100: Named Pipe Lateral Movement
        ==========================================
        Pass-the-Hash via Named Pipe Impersonation (local privilege escalation to lateral):
          CreateNamedPipe → ConnectNamedPipe → ImpersonateNamedPipeClient

        High-privilege services that connect to attacker-controlled pipe:
          - PrintSpooler: SpoolSample coerces SYSTEM auth to attacker pipe
          - RPCSS: Potato attack variants

        CobaltStrike: named_pipe_pivot SMB listener lateral
        Havoc: smb_beacon lateral movement
