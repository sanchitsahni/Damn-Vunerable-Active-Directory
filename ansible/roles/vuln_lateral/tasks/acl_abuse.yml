---
# ==============================================================================
# vuln_lat_ext/tasks/acl_abuse.yml
# Target: coruscant.empire.local
#
# LAT-023  LAPS read ACL for IT_Team (ms-Mcs-AdmPwd read on Computers OU)
# LAT-024  Cross-forest SPN abuse (svc_trooper with SPN on rebel.local)
# LAT-025  WriteSPN on HelpDesk users (targeted Kerberoast-able accounts)
# LAT-029  ForceChangePassword on IT_Team members
# LAT-030  GenericWrite on service accounts for SPN add (Kerberoasting)
# LAT-031  WriteOwner on finance_sync group
# LAT-032  AddMember on Domain Admins for HelpDesk (indirect)
# LAT-034  Pass-the-ticket surface: cached TGTs in memory (note)
# LAT-035  Overpass-the-hash: AES key extraction surface
# ==============================================================================

# LAT-023: LAPS — IT_Team can read ms-Mcs-AdmPwd
- name: LAT-023 - Check if IT_Team group exists
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $g = Get-ADGroup -Filter "SamAccountName -eq 'IT_Team'" -ErrorAction SilentlyContinue
    if ($g) { Write-Output "present" } else { Write-Output "absent" }
  register: lat023_group_check
  changed_when: false
  failed_when: lat023_group_check.rc != 0

- name: LAT-023 - Create IT_Team group if missing
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    New-ADGroup -Name 'IT_Team' -SamAccountName 'IT_Team' `
      -GroupScope Global -GroupCategory Security `
      -Path "CN=Users,{{ ad_domain_dn }}" `
      -Description "LAT-023: Has LAPS read access on Computers OU"
  when: "'absent' in lat023_group_check.stdout"

- name: LAT-023 - Grant IT_Team read on ms-Mcs-AdmPwd attribute in Computers OU
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    try {
      $computersDN = "CN=Computers,{{ ad_domain_dn }}"
      $sid = (Get-ADGroup -Identity 'IT_Team' -ErrorAction Stop).SID
      # ms-Mcs-AdmPwd attribute GUID: {6e3b01aa-a4c7-4f4d-8ca2-f7fdc73df668}
      $ace = New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
        $sid,
        [System.DirectoryServices.ActiveDirectoryRights]::ReadProperty,
        [System.Security.AccessControl.AccessControlType]::Allow,
        [Guid]'6e3b01aa-a4c7-4f4d-8ca2-f7fdc73df668',
        [System.DirectoryServices.ActiveDirectorySecurityInheritance]::Descendents,
        [Guid]'bf967a86-0de6-11d0-a285-00aa003049e2'  # computer objects
      )
      $obj = [ADSI]"LDAP://$computersDN"
      $obj.ObjectSecurity.AddAccessRule($ace)
      $obj.CommitChanges()
      Write-Output "changed: IT_Team LAPS read ACL set"
    } catch {
      Write-Output "WARN: $($_.Exception.Message)"
    }
  register: lat023_set
  changed_when: "'changed:' in lat023_set.stdout"
  failed_when: lat023_set.rc != 0

# LAT-025: WriteSPN on luke.skywalker (targeted Kerberoasting target setup)
- name: LAT-025 - Check if svc_sqlweb has SPN
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $u = Get-ADUser -Identity 'luke.skywalker' -Properties ServicePrincipalNames `
           -ErrorAction SilentlyContinue
    if ($u -and ($u.ServicePrincipalNames -ne $null) -and $u.ServicePrincipalNames.Count -gt 0) {
      Write-Output "present: $($u.ServicePrincipalNames -join ',')"
    } else {
      Write-Output "absent"
    }
  register: lat025_check
  changed_when: false
  failed_when: lat025_check.rc != 0

- name: LAT-025 - Add SPN to luke.skywalker (Kerberoasting target via WriteSPN ACL)
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    try {
      Set-ADUser -Identity 'luke.skywalker' `
        -ServicePrincipalNames @{Add='HTTP/luke.skywalker-web.empire.local:8080'}
      Write-Output "changed: SPN added to luke.skywalker"
    } catch {
      Write-Output "WARN: $($_.Exception.Message)"
    }
  register: lat025_set
  changed_when: "'changed:' in lat025_set.stdout"
  failed_when: lat025_set.rc != 0
  when: "'absent' in lat025_check.stdout"

# LAT-029: ForceChangePassword from HelpDesk to IT_Team members
- name: LAT-029 - Grant HelpDesk ForceChangePassword on IT_Team members
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    try {
      # Grant ForceChangePassword on all users in IT_Team
      $members = Get-ADGroupMember -Identity 'IT_Team' -Recursive -ErrorAction SilentlyContinue
      if (-not $members) {
        Write-Output "no_members"
        exit 0
      }
      $helpDeskSid = (Get-ADGroup -Identity 'HelpDesk' -ErrorAction Stop).SID
      # User-Force-Change-Password extended right: {00299570-246d-11d0-a768-00aa006e0529}
      $ace = New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
        $helpDeskSid,
        [System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight,
        [System.Security.AccessControl.AccessControlType]::Allow,
        [Guid]'00299570-246d-11d0-a768-00aa006e0529'
      )
      foreach ($m in $members) {
        try {
          $u   = Get-ADUser -Identity $m.SamAccountName -ErrorAction SilentlyContinue
          if ($u) {
            $obj = [ADSI]"LDAP://$($u.DistinguishedName)"
            $obj.ObjectSecurity.AddAccessRule($ace)
            $obj.CommitChanges()
          }
        } catch {}
      }
      Write-Output "changed: ForceChangePassword granted on IT_Team members"
    } catch {
      Write-Output "WARN: $($_.Exception.Message)"
    }
  register: lat029_set
  changed_when: "'changed:' in lat029_set.stdout"
  failed_when: lat029_set.rc != 0

# LAT-030: GenericWrite on svc_bobafett2 for SPN add (targeted Kerberoasting)
- name: LAT-030 - Grant HelpDesk GenericWrite on svc_bobafett2
  ansible.windows.win_shell: |
