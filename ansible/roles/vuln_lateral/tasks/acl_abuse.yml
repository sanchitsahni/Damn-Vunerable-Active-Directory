      $ace = New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
        $sid,
        [System.DirectoryServices.ActiveDirectoryRights]::GenericWrite,
        [System.Security.AccessControl.AccessControlType]::Allow
      )
      $obj = [ADSI]"LDAP://$($u.DistinguishedName)"
      $obj.ObjectSecurity.AddAccessRule($ace)
      $obj.CommitChanges()
      Write-Output "changed: HelpDesk GenericWrite on svc_bobafett2"
    } catch {
      Write-Output "WARN: $($_.Exception.Message)"
    }
  register: lat030_set
  changed_when: "'changed:' in lat030_set.stdout"
  failed_when: lat030_set.rc != 0

# LAT-031: WriteOwner on finance_sync group
- name: LAT-031 - Check if finance_sync group exists
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $g = Get-ADGroup -Filter "SamAccountName -eq 'finance_sync'" -ErrorAction SilentlyContinue
