  failed_when: lat031_group_check.rc != 0

- name: LAT-031 - Create finance_sync group
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    New-ADGroup -Name 'finance_sync' -SamAccountName 'finance_sync' `
      -GroupScope Global -GroupCategory Security `
      -Path "CN=Users,{{ ad_domain_dn }}" `
      -Description "LAT-031: WriteOwner ACL abuse target"
  when: "'absent' in lat031_group_check.stdout"

- name: LAT-031 - Grant svc_bobafett WriteOwner on finance_sync
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    try {
      $g   = Get-ADGroup -Identity 'finance_sync' -ErrorAction Stop
