---
# ==============================================================================
# vuln_lateral/tasks/acl.yml
# Target: dc01.corp.local
#
# LAT-021  michael.scott → GenericAll on the domain naming context object
# LAT-022  dwight.schrute      → Validated-SPN write on svc_printer
# LAT-034  Foreign Security Principal (finance.local Administrator) in
#          corp.local Corporate Admins (cross-ref ad_trust for trust prereq)
# ==============================================================================

# ------------------------------------------------------------------------------
# LAT-021: michael.scott GenericAll on domain object
# GenericAll on the domain NC root enables DCSync-style access and object
# manipulation without being in Domain Admins.
# ------------------------------------------------------------------------------
- name: LAT-021 - Check GenericAll ACE for michael.scott on domain object
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $domDn = (Get-ADDomain).DistinguishedName
    $acl = Get-Acl "AD:\$domDn"
    $exists = $acl.Access | Where-Object {
      $_.IdentityReference -like "*michael.scott*" -and
      $_.ActiveDirectoryRights -match "GenericAll"
    }
    if ($exists) { Write-Output "present" } else { Write-Output "absent" }
  register: result_lat021_check
  changed_when: false
  failed_when: result_lat021_check.rc != 0

- name: LAT-021 - Grant michael.scott GenericAll on domain object
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $usr    = Get-ADUser -Identity "michael.scott" -ErrorAction Stop
    $sid    = New-Object System.Security.Principal.SecurityIdentifier ($usr.SID)
    $domDn  = (Get-ADDomain).DistinguishedName
    $acl    = Get-Acl "AD:\$domDn"
    $rule   = New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
                $sid, "GenericAll", "Allow")
    $acl.AddAccessRule($rule)
    Set-Acl -Path "AD:\$domDn" -AclObject $acl
  when: "'absent' in result_lat021_check.stdout"
  register: result_lat021_set
  failed_when: result_lat021_set.rc != 0

# ------------------------------------------------------------------------------
# LAT-022: dwight.schrute Validated-SPN write on svc_printer
# Allows dwight.schrute to register arbitrary SPNs on svc_printer, enabling
# Kerberoasting of a newly-registered service principal.
# Validated-SPN GUID: f3a64788-5306-11d1-a9c5-0000f80367c1
# ------------------------------------------------------------------------------
- name: LAT-022 - Check Validated-SPN ACE for dwight.schrute on svc_printer
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $target = Get-ADUser -Identity "svc_printer"
    $acl = Get-Acl "AD:\$($target.DistinguishedName)"
    $exists = $acl.Access | Where-Object {
      $_.IdentityReference -like "*dwight.schrute*" -and
      $_.ObjectType -eq [guid]"f3a64788-5306-11d1-a9c5-0000f80367c1"
    }
    if ($exists) { Write-Output "present" } else { Write-Output "absent" }
  register: result_lat022_check
  changed_when: false
  failed_when: result_lat022_check.rc != 0

- name: LAT-022 - Grant dwight.schrute Validated-SPN write on svc_printer
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $src  = Get-ADUser -Identity "dwight.schrute" -ErrorAction Stop
    $tgt  = Get-ADUser -Identity "svc_printer" -ErrorAction Stop
    $sid  = New-Object System.Security.Principal.SecurityIdentifier ($src.SID)
    $acl  = Get-Acl "AD:\$($tgt.DistinguishedName)"
    $guid = [guid]"f3a64788-5306-11d1-a9c5-0000f80367c1"
    $rule = New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
              $sid, "WriteProperty", "Allow", $guid)
    $acl.AddAccessRule($rule)
    Set-Acl -Path "AD:\$($tgt.DistinguishedName)" -AclObject $acl
  when: "'absent' in result_lat022_check.stdout"
  register: result_lat022_set
  failed_when: result_lat022_set.rc != 0

# ------------------------------------------------------------------------------
# LAT-034: Foreign Security Principal from finance.local in Corporate Admins
# Cross-forest FSP requires the corp <-> finance trust to already exist
# (ad_trust role handles trust creation).
# ------------------------------------------------------------------------------
- name: LAT-034 - Add finance.local Administrator as FSP in corp.local Corporate Admins
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    try {
      # Resolve SID of finance.local Administrator directly from its ADWS — the
      # NTAccount.Translate (LSA) path fails right after trust creation.
      $sid = (Get-ADUser -Server finance.local -Identity Administrator -ErrorAction Stop).SID.Value
      $domDn = (Get-ADDomain).DistinguishedName
      $fspDn = "CN=$sid,CN=ForeignSecurityPrincipals,$domDn"

      # Create FSP object if not present
      if (-not (Get-ADObject -Filter "objectClass -eq 'foreignSecurityPrincipal' -and Name -eq '$sid'" `
                              -ErrorAction SilentlyContinue)) {
        New-ADObject -Name $sid -Type foreignSecurityPrincipal `
          -Path "CN=ForeignSecurityPrincipals,$domDn" -ErrorAction SilentlyContinue
      }

      # Check membership before adding
      $grpMembers = Get-ADGroupMember -Identity "Corporate Admins" -ErrorAction SilentlyContinue |
                      Select-Object -ExpandProperty distinguishedName
      if ($grpMembers -notcontains $fspDn) {
        Add-ADGroupMember -Identity "Corporate Admins" -Members $fspDn -ErrorAction Stop
        Write-Output "changed: FSP $sid added to Corporate Admins"
      } else {
        Write-Output "ok: FSP already member"
      }
    } catch {
      Write-Error "LAT-034 FSP: $($_.Exception.Message)"
    }
  register: result_lat034
  changed_when: "'changed:' in result_lat034.stdout"
  failed_when: >
    result_lat034.rc != 0 and
    "trust" not in (result_lat034.stderr | default("") | lower) and
    "not found" not in (result_lat034.stderr | default("") | lower)
