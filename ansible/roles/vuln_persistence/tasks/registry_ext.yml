---
# ==============================================================================
# vuln_persistence_ext/tasks/registry.yml
# PER-001  — Registry Run Keys (HKLM + HKCU)
# PER-007  — Netsh helper DLL
# PER-008  — COM hijacking via HKCU InprocServer32
# PER-009  — Authentication Package (mimilib in Authentication Packages)
# PER-010  — W32Time DLL hijack (custom TimeProvider)
# PER-011  — BootExecute modification
# PER-012  — AppInit_DLLs
# PER-013  — Accessibility tool IFEO Debugger entries (osk/magnify/narrator)
# PER-024  — Custom SSP (mimilib in Security Packages)
# PER-026  — Auth package persistence (same key as PER-009, verify consistency)
# ==============================================================================

# ------------------------------------------------------------------------------
# PER-001: Registry Run Keys — HKLM and HKCU
# ------------------------------------------------------------------------------
- name: PER-001 - Check HKLM Run key
  ansible.windows.win_shell: |
    $v = (Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" `
            -Name DVADPersist -ErrorAction SilentlyContinue).DVADPersist
    if ($v) { Write-Output "present" } else { Write-Output "absent" }
  register: per001_hklm_check
  changed_when: false
  failed_when: per001_hklm_check.rc != 0

- name: PER-001 - Set HKLM Run key (DVADPersist)
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
    name: DVADPersist
    data: 'C:\Tools\beacon.exe'
    type: string
  when: "'absent' in per001_hklm_check.stdout"

- name: PER-001 - Check HKCU Run key
  ansible.windows.win_shell: |
    $v = (Get-ItemProperty -Path "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" `
            -Name DVADPersistUser -ErrorAction SilentlyContinue).DVADPersistUser
    if ($v) { Write-Output "present" } else { Write-Output "absent" }
  register: per001_hkcu_check
  changed_when: false
  failed_when: per001_hkcu_check.rc != 0

- name: PER-001 - Set HKCU Run key (DVADPersistUser)
  ansible.windows.win_regedit:
    path: 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
    name: DVADPersistUser
    data: 'C:\Tools\beacon.exe'
    type: string
  when: "'absent' in per001_hkcu_check.stdout"

# ------------------------------------------------------------------------------
# PER-007: Netsh Helper DLL — create placeholder DLL then register
# ------------------------------------------------------------------------------
- name: PER-007 - Ensure Tools directory exists
  ansible.windows.win_file:
    path: '{{ tools_dir }}'
    state: directory

- name: PER-007 - Create placeholder dvad_helper.dll
  ansible.windows.win_copy:
    dest: 'C:\Tools\dvad_helper.dll'
    content: "DVAD placeholder DLL — PER-007 netsh helper"
  register: per007_dll

- name: PER-007 - Check existing netsh helper list
  ansible.windows.win_shell: |
    $out = & netsh.exe show helper 2>&1 | Out-String
    if ($out -match 'dvad_helper') { Write-Output "present" } else { Write-Output "absent" }
  register: per007_check
  changed_when: false
  failed_when: per007_check.rc != 0

- name: PER-007 - Register netsh helper DLL
  ansible.windows.win_shell: |
    & netsh.exe add helper C:\Tools\dvad_helper.dll 2>&1 | Out-Null
  when: "'absent' in per007_check.stdout"

# ------------------------------------------------------------------------------
# PER-008: COM Hijacking — HKCU InprocServer32 for Performance Monitor CLSID
# CLSID {B5F8350B-0548-48B1-A6EE-88BD00B4A5E7} (Performance Monitor)
# ------------------------------------------------------------------------------
- name: PER-008 - Check COM hijack HKCU key
  ansible.windows.win_shell: |
    $v = (Get-ItemProperty `
            -Path "HKCU:\Software\Classes\CLSID\{B5F8350B-0548-48B1-A6EE-88BD00B4A5E7}\InprocServer32" `
            -ErrorAction SilentlyContinue).'(default)'
    if ($v) { Write-Output "present" } else { Write-Output "absent" }
  register: per008_check
  changed_when: false
  failed_when: per008_check.rc != 0

- name: PER-008 - Create evil.dll placeholder
  ansible.windows.win_copy:
    dest: 'C:\Tools\evil.dll'
    content: "DVAD placeholder DLL — PER-008 COM hijack"
  when: "'absent' in per008_check.stdout"

- name: PER-008 - Set COM hijack InprocServer32 (Performance Monitor CLSID)
  ansible.windows.win_regedit:
    path: 'HKCU:\Software\Classes\CLSID\{B5F8350B-0548-48B1-A6EE-88BD00B4A5E7}\InprocServer32'
    name: ''
    data: 'C:\Tools\evil.dll'
    type: string
  when: "'absent' in per008_check.stdout"

# ------------------------------------------------------------------------------
# PER-009 / PER-026: Authentication Packages — add mimilib entry
# NOTE: mimilib is not loaded as a real DLL; registry entry only.
# ------------------------------------------------------------------------------
- name: PER-009/026 - Read current Authentication Packages value
  ansible.windows.win_shell: |
    $val = (Get-ItemProperty `
              -Path "Registry::HKLM\SYSTEM\CurrentControlSet\Control\Lsa" `
              -Name "Authentication Packages")."Authentication Packages"
    if ($val -contains 'mimilib') { Write-Output "present" } else { Write-Output "absent" }
  register: per009_check
  changed_when: false
  failed_when: per009_check.rc != 0

- name: PER-009/026 - Append mimilib to Authentication Packages
  ansible.windows.win_shell: |
    $k = "Registry::HKLM\SYSTEM\CurrentControlSet\Control\Lsa"
    $cur = (Get-ItemProperty -Path $k -Name "Authentication Packages")."Authentication Packages"
    $new = [System.Collections.ArrayList]@($cur)
    $new.Add('mimilib') | Out-Null
    Set-ItemProperty -Path $k -Name "Authentication Packages" -Value ([string[]]$new) -Type MultiString
  when: "'absent' in per009_check.stdout"

# ------------------------------------------------------------------------------
# PER-010: W32Time DLL hijack — custom TimeProvider key
# ------------------------------------------------------------------------------
- name: PER-010 - Create placeholder w32tm.dll
  ansible.windows.win_copy:
    dest: 'C:\Windows\Temp\w32tm.dll'
    content: "DVAD placeholder DLL — PER-010 W32Time hijack"

- name: PER-010 - Check W32Time DVADProvider DllName key
  ansible.windows.win_shell: |
    $v = (Get-ItemProperty `
            -Path "Registry::HKLM\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\DVADProvider" `
            -Name DllName -ErrorAction SilentlyContinue).DllName
    if ($v) { Write-Output "present" } else { Write-Output "absent" }
  register: per010_check
  changed_when: false
  failed_when: per010_check.rc != 0

- name: PER-010 - Set W32Time TimeProvider DllName
  ansible.windows.win_regedit:
    path: 'HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\DVADProvider'
    name: DllName
    data: 'C:\Windows\Temp\w32tm.dll'
    type: string
  when: "'absent' in per010_check.stdout"

- name: PER-010 - Disable the rogue provider at startup (Enabled=0)
  ansible.windows.win_regedit:
    path: 'HKLM:\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders\DVADProvider'
    name: Enabled
    data: 0
    type: dword

# ------------------------------------------------------------------------------
# PER-011: BootExecute — prepend DVADCheck entry
# ------------------------------------------------------------------------------
- name: PER-011 - Read current BootExecute value
  ansible.windows.win_shell: |
    $val = (Get-ItemProperty `
              -Path "Registry::HKLM\SYSTEM\CurrentControlSet\Control\Session Manager" `
              -Name BootExecute).BootExecute
    if ($val -contains 'DVADCheck') { Write-Output "present" } else { Write-Output "absent" }
  register: per011_check
  changed_when: false
  failed_when: per011_check.rc != 0

- name: PER-011 - Prepend DVADCheck to BootExecute
  ansible.windows.win_shell: |
    $k = "Registry::HKLM\SYSTEM\CurrentControlSet\Control\Session Manager"
    $cur = (Get-ItemProperty -Path $k -Name BootExecute).BootExecute
    $new = [System.Collections.ArrayList]@()
    $new.Add('DVADCheck') | Out-Null
    foreach ($e in $cur) { $new.Add($e) | Out-Null }
    Set-ItemProperty -Path $k -Name BootExecute -Value ([string[]]$new) -Type MultiString
  when: "'absent' in per011_check.stdout"

# ------------------------------------------------------------------------------
# PER-012: AppInit_DLLs
# ------------------------------------------------------------------------------
- name: PER-012 - Create placeholder dvad_appinit.dll
  ansible.windows.win_copy:
    dest: 'C:\Tools\dvad_appinit.dll'
    content: "DVAD placeholder DLL — PER-012 AppInit_DLLs"

- name: PER-012 - Check AppInit_DLLs current value
  ansible.windows.win_shell: |
    $v = (Get-ItemProperty `
            -Path "Registry::HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows" `
            -Name AppInit_DLLs -ErrorAction SilentlyContinue).AppInit_DLLs
    if ($v -and $v -ne '') { Write-Output "present" } else { Write-Output "absent" }
  register: per012_check
  changed_when: false
  failed_when: per012_check.rc != 0

- name: PER-012 - Set AppInit_DLLs registry values
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows'
    name: '{{ item.name }}'
    data: '{{ item.data }}'
    type: '{{ item.type }}'
  loop:
    - { name: AppInit_DLLs,            data: 'C:\Tools\dvad_appinit.dll', type: string }
    - { name: LoadAppInit_DLLs,        data: 1,                           type: dword  }
    - { name: RequireSignedAppInit_DLLs, data: 0,                         type: dword  }
  when: "'absent' in per012_check.stdout"

# ------------------------------------------------------------------------------
# PER-013: Accessibility tools IFEO Debugger (osk, magnify, narrator)
# Using IFEO Debugger key — complementing the sethc approach in files.yml
# ------------------------------------------------------------------------------
- name: PER-013 - Check IFEO Debugger on osk.exe
  ansible.windows.win_shell: |
    $v = (Get-ItemProperty `
            -Path "Registry::HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\osk.exe" `
            -Name Debugger -ErrorAction SilentlyContinue).Debugger
    if ($v) { Write-Output "present" } else { Write-Output "absent" }
  register: per013_osk_check
  changed_when: false
  failed_when: per013_osk_check.rc != 0

- name: PER-013 - Set IFEO Debugger on accessibility tools
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\{{ item }}'
    name: Debugger
    data: 'cmd.exe'
    type: string
  loop:
    - osk.exe
    - magnify.exe
    - Narrator.exe
  when: "'absent' in per013_osk_check.stdout"

# ------------------------------------------------------------------------------
# PER-024: Custom SSP — add mimilib to Security Packages
# (separate from Authentication Packages in PER-009/026)
# ------------------------------------------------------------------------------
- name: PER-024 - Read current Security Packages value
  ansible.windows.win_shell: |
    $val = (Get-ItemProperty `
              -Path "Registry::HKLM\SYSTEM\CurrentControlSet\Control\Lsa" `
              -Name "Security Packages")."Security Packages"
    if ($val -contains 'mimilib') { Write-Output "present" } else { Write-Output "absent" }
  register: per024_check
  changed_when: false
  failed_when: per024_check.rc != 0

- name: PER-024 - Append mimilib to Security Packages
  ansible.windows.win_shell: |
    $k = "Registry::HKLM\SYSTEM\CurrentControlSet\Control\Lsa"
    $cur = (Get-ItemProperty -Path $k -Name "Security Packages")."Security Packages"
    $new = [System.Collections.ArrayList]@($cur)
    $new.Add('mimilib') | Out-Null
    Set-ItemProperty -Path $k -Name "Security Packages" -Value ([string[]]$new) -Type MultiString
  when: "'absent' in per024_check.stdout"
