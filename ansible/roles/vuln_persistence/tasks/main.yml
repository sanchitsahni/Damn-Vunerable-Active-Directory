---
# ==============================================================================
# vuln_persistence/tasks/main.yml
# Target: coruscant.empire.local
# ==============================================================================

- name: Import registry persistence tasks (DSRM, IFEO)
  ansible.builtin.import_tasks: registry.yml

- name: Import ACL persistence tasks (AdminSDHolder, KeyCredentialLink)
  ansible.builtin.import_tasks: acl.yml

- name: Import GPO backdoor tasks
  ansible.builtin.import_tasks: gpo.yml
  # EMPIREBackdoorGPO is hardcoded to DC=empire,DC=local — empire-root only.
  # Without this it ran on members (no ADWS) + child/foreign DCs (target DN absent).
  when: inventory_hostname == 'coruscant.empire.local'

# Extended persistence surfaces (absorbed from vuln_persistence_ext)

- name: Import extended service persistence surfaces (coruscant + tatooine)
  ansible.builtin.import_tasks: services.yml
  when: inventory_hostname in ['coruscant.empire.local', 'tatooine.empire.local']

- name: Import extended file persistence surfaces (coruscant + tatooine)
  ansible.builtin.import_tasks: files.yml
  when: inventory_hostname in ['coruscant.empire.local', 'tatooine.empire.local']

- name: Import extended registry persistence surfaces (coruscant + tatooine)
  ansible.builtin.import_tasks: registry_ext.yml
  when: inventory_hostname in ['coruscant.empire.local', 'tatooine.empire.local']
