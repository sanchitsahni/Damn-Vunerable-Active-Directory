---
# ==============================================================================
# ad_domain/tasks/users.yml
# Creates all lab users in empire.local.
# Only imported when ad_domain == "empire.local".
#
# Intentional misconfigurations preserved:
#   - svc_palpatine: DoNotRequirePreAuth=true (AS-REP roasting — DF-002)
#   - svc_jabba:    PasswordNeverExpires + weak SPN (Kerberoasting — DF-001)
#   - svc_bobafett:    PasswordNeverExpires (persistence account)
#   - Many accounts: PasswordNeverExpires intentional for stable lab targets
# ==============================================================================

- name: Create empire.local users
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $PSDefaultParameterValues = @{ '*-AD*:Server' = 'localhost' }
    $base = "DC=empire,DC=local"

    # Helper — returns $true if user already exists
    function User-Exists($sam) {
      return [bool](Get-ADUser -Filter "SamAccountName -eq '$sam'" -ErrorAction SilentlyContinue)
    }

    $users = @(
      # ---- Regular lab users (Office / Galactic Empire theme) ----
      @{
        Sam  = "leia.organa"
        Name = "Leia Organa"
        UPN  = "leia.organa@empire.local"
        Pwd  = "Alice1234!"
        Path = "OU=Users,OU=Corp,$base"
        Opts = @{}
      },
      @{
        Sam  = "biggs.darklighter"
        Name = "Biggs Darklighter"
        UPN  = "biggs.darklighter@empire.local"
        Pwd  = "Bob12345!"
        Path = "OU=Users,OU=Corp,$base"
        Opts = @{}
      },
      @{
        Sam  = "sheev.palpatine"
        Name = "Sheev Palpatine"
        UPN  = "sheev.palpatine@empire.local"
        Pwd  = "DarkLord1!"
        Path = "OU=Users,OU=Corp,$base"
        Opts = @{}
      },
      @{
        Sam  = "darth.maul"
        Name = "Darth Maul"
        UPN  = "darth.maul@empire.local"
        Pwd  = "DeathStar2024!"
        Path = "OU=Users,OU=Corp,$base"
        Opts = @{}
      },
      @{
        Sam  = "poe.dameron"
        Name = "Poe Dameron"
        UPN  = "poe.dameron@empire.local"
        Pwd  = "TempWorker1!"
        Path = "OU=Users,OU=Corp,$base"
        Opts = @{}
      },
      @{
        Sam  = "wedge.antilles"
        Name = "Wedge Antilles"
        UPN  = "wedge.antilles@empire.local"
        Pwd  = "AndrewB2024!"
        Path = "OU=Users,OU=Corp,$base"
        Opts = @{}
      },
      @{
        Sam  = "mace.windu"
        Name = "Mace Windu"
        UPN  = "mace.windu@empire.local"
        Pwd  = "Stanley2024!"
        Path = "OU=Users,OU=Corp,$base"
        Opts = @{}
      },
      # ---- Generic users for recon/enumeration surface ----
      @{
        Sam  = "luke.skywalker"
        Name = "Luke Skywalker"
        UPN  = "luke.skywalker@empire.local"
        Pwd  = "SithLord123!"
        Path = "OU=Users,OU=Corp,$base"
        Opts = @{}
      },
      @{
        Sam  = "ahsoka.tano"
        Name = "Ahsoka Tano"
        UPN  = "ahsoka.tano@empire.local"
        Pwd  = "User1234!"
        Path = "OU=Users,OU=Corp,$base"
        Opts = @{}
      },
      @{
        Sam  = "jyn.erso"
        Name = "Jyn Erso"
        UPN  = "jyn.erso@empire.local"
        Pwd  = "User1234!"
        Path = "OU=Users,OU=Corp,$base"
        Opts = @{}
      },
      @{
        Sam  = "kylo.ren"
        Name = "Kylo Ren"
        UPN  = "kylo.ren@empire.local"
        Pwd  = "User1234!"
        Path = "OU=Users,OU=Corp,$base"
        Opts = @{}
      },
      @{
        Sam  = "wilhuff.tarkin"
        Name = "Wilhuff Tarkin"
        UPN  = "wilhuff.tarkin@empire.local"
        Pwd  = "User1234!"
        Path = "OU=Users,OU=Corp,$base"
        Opts = @{}
      },
      @{
        Sam  = "jabba.hutt"
        Name = "Jabba Hutt"
        UPN  = "jabba.hutt@empire.local"
        Pwd  = "User1234!"
        Path = "OU=Users,OU=Corp,$base"
        Opts = @{}
      },
      @{
        Sam  = "mon.mothma"
        Name = "Mon Mothma"
        UPN  = "mon.mothma@empire.local"
        Pwd  = "User1234!"
        Path = "OU=Users,OU=Corp,$base"
        Opts = @{}
      },
      # ---- Service accounts in dedicated OU ----
      @{
        Sam  = "svc_trooper"
        Name = "svc_trooper"
        UPN  = "svc_trooper@empire.local"
        Pwd  = "Printer2024!"
        Path = "OU=ServiceAccounts,OU=Corp,$base"
        Opts = @{ PasswordNeverExpires = $true }
      },
      @{
        Sam  = "svc_maul"
        Name = "svc_maul"
        UPN  = "svc_maul@empire.local"
        Pwd  = "DeathStar1!"
        Path = "OU=ServiceAccounts,OU=Corp,$base"
        Opts = @{ PasswordNeverExpires = $true }
      },
      @{
        Sam  = "svc_sidious"
        Name = "svc_sidious"
        UPN  = "svc_sidious@empire.local"
        Pwd  = "Tarkin123"
        Path = "OU=ServiceAccounts,OU=Corp,$base"
        Opts = @{ PasswordNeverExpires = $true }
      },
      # DF-002: AS-REP roasting target — DoNotRequirePreAuth intentional
      @{
        Sam  = "svc_palpatine"
        Name = "svc_palpatine"
        UPN  = "svc_palpatine@empire.local"
        Pwd  = "NoPreauth1!"
        Path = "OU=ServiceAccounts,OU=Corp,$base"
        # NOTE: DoesNotRequirePreAuth is NOT a valid New-ADUser parameter — it
        # silently errored here and svc_palpatine never got created. The AS-REP
        # flag is set later by vuln_kerberos CRED-002 (Set-ADAccountControl).
        Opts = @{ PasswordNeverExpires = $true }
      },
      # Backup account — intentionally over-privileged for DF-006
      @{
        Sam  = "svc_bobafett"
        Name = "svc_bobafett"
        UPN  = "svc_bobafett@empire.local"
        Pwd  = "Bossk2024!"
        Path = "OU=ServiceAccounts,OU=Corp,$base"
        Opts = @{ PasswordNeverExpires = $true }
      },
      # DF-001: Kerberoasting target — weak password + SPN set after creation
      @{
        Sam  = "svc_jabba"
        Name = "svc_jabba"
        UPN  = "svc_jabba@empire.local"
        Pwd  = "SithLord1!"
        Path = "OU=ServiceAccounts,OU=Corp,$base"
        Opts = @{ PasswordNeverExpires = $true }
      },
      # SQL service account — SPN set after creation
      @{
        Sam  = "svc_greedo"
        Name = "svc_greedo"
        UPN  = "svc_greedo@empire.local"
        Pwd  = "Greedo1234"
        Path = "OU=ServiceAccounts,OU=Corp,$base"
        Opts = @{ PasswordNeverExpires = $true }
      },
      # Linux pivot account — creds are leaked on mandalore (/home/obiwan/.creds_backup.txt
      # and the readable keytab path). Rooting mandalore yields these, giving a valid
      # empire.local foothold that feeds the existing chain to Domain Admin.
      @{
        Sam  = "svc_r2d2"
        Name = "svc_r2d2"
        UPN  = "svc_r2d2@empire.local"
        Pwd  = "Droid2024!"
        Path = "OU=ServiceAccounts,OU=Corp,$base"
        Opts = @{ PasswordNeverExpires = $true }
      },
      # DF-042: constrained-delegation SOURCE account. vuln_forest grants it
      # msDS-AllowedToDelegateTo HTTP/tatooine + protocol transition; given an SPN
      # below so it is kerberoastable (the acquisition path into the delegation).
      @{
        Sam  = "svc_c3po"
        Name = "svc_c3po"
        UPN  = "svc_c3po@empire.local"
        Pwd  = "WebSvc2024!"
        Path = "OU=ServiceAccounts,OU=Corp,$base"
        Opts = @{ PasswordNeverExpires = $true }
      }
    )

    $created = 0
    foreach ($u in $users) {
      if (User-Exists $u.Sam) {
        Write-Output "EXISTS: $($u.Sam)"
        continue
      }

      $params = @{
        Name              = $u.Name
        SamAccountName    = $u.Sam
        UserPrincipalName = $u.UPN
        AccountPassword   = (ConvertTo-SecureString $u.Pwd -AsPlainText -Force)
        Enabled           = $true
        Path              = $u.Path
      }
      # Merge optional attributes
      foreach ($k in $u.Opts.Keys) { $params[$k] = $u.Opts[$k] }

      New-ADUser @params
      Write-Output "CREATED: $($u.Sam)"
      $created++
    }

    # ---- SPNs for Kerberoasting targets (DF-001) ----
    # Set outside the loop so they are always applied even on re-runs
    $spns = @{
      "svc_jabba"   = "HTTP/legacy.empire.local"
      "svc_greedo"     = "MSSQLSvc/kamino.empire.local:1433"
      "svc_maul"    = "HTTP/vader.empire.local"
      "svc_c3po"       = "HTTP/web.empire.local"
      # sheev.palpatine holds GenericAll-on-domain (LAT-021), Schema Admins/DCShadow
      # (CRED-015) and ExtraSID (DF-007). Give it an SPN so a sprayed domain user
      # can Kerberoast it and crack "DarkLord1!" (in wordlists) — otherwise
      # those three high-value techniques have no acquisition path = unexploitable.
      "sheev.palpatine" = "HTTP/mgmt.empire.local"
    }
    foreach ($sam in $spns.Keys) {
      Set-ADUser -Identity $sam -ServicePrincipalNames @{Add=$spns[$sam]} -ErrorAction SilentlyContinue
    }

    Write-Output "DONE: created=$created"
  register: users_result
  changed_when: "'CREATED:' in users_result.stdout"
