---
# ==============================================================================
# vuln_kerberos/tasks/main.yml
# Target: dc01.corp.local
#
# Configures Kerberos attack vectors:
#   CRED-001  Kerberoastable accounts — weak passwords + SPNs
#   CRED-002  AS-REP Roasting (DoNotRequirePreAuth)
#   CRED-016  Constrained delegation (TrustedToAuthForDelegation) on svc_printer
#   CRED-018  Unconstrained delegation on FILE01 / WS01 computer accounts
#   RC4-only  msDS-SupportedEncryptionTypes=1 on svc_printer for hash downgrade demo
# ==============================================================================

# ------------------------------------------------------------------------------
# CRED-001: Weak passwords on Kerberoastable accounts
# Password reset is unconditionally idempotent — there is no reliable way to
# check the current password hash, so we always reset to the target value.
# ------------------------------------------------------------------------------
- name: CRED-001 - Reset weak passwords on Kerberoastable service accounts
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $accounts = @{
      "svc_printer" = "{{ kerberoast_accounts.svc_printer }}"
      "svc_dwight" = "{{ kerberoast_accounts.svc_dwight }}"
      "svc_creed" = "{{ kerberoast_accounts.svc_creed }}"
    }
    $errors = @()
    foreach ($name in $accounts.Keys) {
      $sec = ConvertTo-SecureString $accounts[$name] -AsPlainText -Force
      try {
        Set-ADAccountPassword -Identity $name -NewPassword $sec -Reset -ErrorAction Stop
        Write-Output "Password reset: $name"
      } catch {
        $errors += "$name`: $($_.Exception.Message)"
      }
    }
    if ($errors.Count -gt 0) { Write-Error ($errors -join "; ") }
  changed_when: true
  failed_when: >
    result_kerberoast_pw.rc != 0 and
    result_kerberoast_pw.stderr is defined and
    result_kerberoast_pw.stderr != "" and
    "already" not in result_kerberoast_pw.stderr | lower
  register: result_kerberoast_pw

# ------------------------------------------------------------------------------
# CRED-001: Register SPNs for Kerberoast targets
# Check servicePrincipalName attribute before adding.
# ------------------------------------------------------------------------------
- name: CRED-001 - Check existing SPN on svc_printer
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $u = Get-ADUser -Identity "svc_printer" -Properties ServicePrincipalName
    if ($u.ServicePrincipalName -contains "{{ spn_printer }}") {
      Write-Output "present"
    } else {
      Write-Output "absent"
    }
  register: result_spn_printer
  changed_when: false
  failed_when: result_spn_printer.rc != 0

- name: CRED-001 - Add SPN HTTP/print.corp.local on svc_printer
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    Set-ADUser -Identity "svc_printer" -ServicePrincipalNames @{Add="{{ spn_printer }}"}
  when: "'absent' in result_spn_printer.stdout"
  failed_when: >
    result_spn_printer_add.rc != 0 and
    "already" not in (result_spn_printer_add.stderr | default("") | lower) and
    "duplicate" not in (result_spn_printer_add.stderr | default("") | lower)
  register: result_spn_printer_add

- name: CRED-001 - Check existing SPN on svc_dwight
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $u = Get-ADUser -Identity "svc_dwight" -Properties ServicePrincipalName
    if ($u.ServicePrincipalName -contains "{{ spn_dwight }}") {
      Write-Output "present"
    } else {
      Write-Output "absent"
    }
  register: result_spn_dwight
  changed_when: false
  failed_when: result_spn_dwight.rc != 0

- name: CRED-001 - Add SPN MSSQLSvc/sql01.corp.local:1433 on svc_dwight
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    Set-ADUser -Identity "svc_dwight" -ServicePrincipalNames @{Add="{{ spn_dwight }}"}
  when: "'absent' in result_spn_dwight.stdout"
  failed_when: >
    result_spn_dwight_add.rc != 0 and
    "already" not in (result_spn_dwight_add.stderr | default("") | lower) and
    "duplicate" not in (result_spn_dwight_add.stderr | default("") | lower) and
    "unique" not in (result_spn_dwight_add.stderr | default("") | lower)
  register: result_spn_dwight_add

# ------------------------------------------------------------------------------
# CRED-002: DoNotRequirePreAuth on svc_michael (AS-REP Roasting)
# Check the attribute via Get-ADUser before setting.
# ------------------------------------------------------------------------------
- name: CRED-002 - Check DoesNotRequirePreAuth on svc_michael
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $u = Get-ADUser -Identity "{{ asrep_account }}" -Properties DoesNotRequirePreAuth
    if ($u.DoesNotRequirePreAuth) { Write-Output "already_set" } else { Write-Output "needs_set" }
  register: result_asrep_check
  changed_when: false
  failed_when: result_asrep_check.rc != 0

- name: CRED-002 - Enable DoesNotRequirePreAuth on svc_michael
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    Set-ADAccountControl -Identity "{{ asrep_account }}" -DoesNotRequirePreAuth $true
  when: "'needs_set' in result_asrep_check.stdout"
  failed_when: result_asrep_enable.rc != 0
  register: result_asrep_enable

# ------------------------------------------------------------------------------
# CRED-016: Constrained delegation (TrustedToAuthForDelegation) on svc_printer
# Also sets msDS-AllowedToDelegateTo for S4U2Proxy target.
# ------------------------------------------------------------------------------
- name: CRED-016 - Check TrustedToAuthForDelegation on svc_printer
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $u = Get-ADUser -Identity "svc_printer" -Properties TrustedToAuthForDelegation, "msDS-AllowedToDelegateTo"
    $delegOk = $u.TrustedToAuthForDelegation
    $targetOk = $u."msDS-AllowedToDelegateTo" -contains "{{ delegation_target }}"
    if ($delegOk -and $targetOk) { Write-Output "ok" } else { Write-Output "needs_set" }
  register: result_constrained_check
  changed_when: false
  failed_when: result_constrained_check.rc != 0

- name: CRED-016 - Set TrustedToAuthForDelegation and delegation target on svc_printer
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    Set-ADAccountControl -Identity "svc_printer" -TrustedToAuthForDelegation $true
    Set-ADUser -Identity "svc_printer" -Add @{"msDS-AllowedToDelegateTo" = "{{ delegation_target }}"}
  when: "'needs_set' in result_constrained_check.stdout"
  failed_when: result_constrained_set.rc != 0
  register: result_constrained_set

# ------------------------------------------------------------------------------
# CRED-018: Unconstrained delegation on FILE01 and WS01 computer accounts
# TrustedForDelegation=$true; check userAccountControl bit 0x80000 before set.
# UAC flag 524288 (0x80000) = TRUSTED_FOR_DELEGATION
# ------------------------------------------------------------------------------
- name: CRED-018 - Check and set unconstrained delegation on FILE01
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $comp = Get-ADComputer -Identity "FILE01" -Properties TrustedForDelegation
    if (-not $comp.TrustedForDelegation) {
      Set-ADAccountControl -Identity $comp -TrustedForDelegation $true
      Write-Output "changed"
    } else {
      Write-Output "ok"
    }
  register: result_unconstrained_file01
  changed_when: "'changed' in result_unconstrained_file01.stdout"
  failed_when: result_unconstrained_file01.rc != 0

- name: CRED-018 - Check and set unconstrained delegation on WS01
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $comp = Get-ADComputer -Identity "WS01" -Properties TrustedForDelegation
    if (-not $comp.TrustedForDelegation) {
      Set-ADAccountControl -Identity $comp -TrustedForDelegation $true
      Write-Output "changed"
    } else {
      Write-Output "ok"
    }
  register: result_unconstrained_ws01
  changed_when: "'changed' in result_unconstrained_ws01.stdout"
  failed_when: result_unconstrained_ws01.rc != 0

# ------------------------------------------------------------------------------
# RC4 downgrade: force RC4-only encryption on svc_printer
# msDS-SupportedEncryptionTypes=1 (RC4_HMAC_MD5 only).
# Lets attackers request a Kerberoast ticket with a crackable RC4 hash even
# when the DC prefers AES.
# ------------------------------------------------------------------------------
- name: RC4-downgrade - Check msDS-SupportedEncryptionTypes on svc_printer
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $u = Get-ADUser -Identity "svc_printer" -Properties "msDS-SupportedEncryptionTypes"
    $val = $u."msDS-SupportedEncryptionTypes"
    Write-Output $val
  register: result_rc4_check
  changed_when: false
  failed_when: result_rc4_check.rc != 0

- name: RC4-downgrade - Set msDS-SupportedEncryptionTypes=1 (RC4-only) on svc_printer
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    # 0x1 = RC4_HMAC_MD5; forces downgrade during Kerberoast for weaker hash
    Set-ADUser -Identity "svc_printer" -Replace @{"msDS-SupportedEncryptionTypes" = {{ rc4_only_enctype }}}
  when: result_rc4_check.stdout | trim != rc4_only_enctype | string
  failed_when: result_rc4_set.rc != 0
  register: result_rc4_set

# ------------------------------------------------------------------------------
# RBCD: configure msDS-AllowedToActOnBehalfOfOtherIdentity on SQL01 for svc_printer
# Enables S4U2Self/S4U2Proxy abuse chain from svc_printer -> SQL01
# Check attribute before writing to avoid unnecessary changes.
# ------------------------------------------------------------------------------
- name: RBCD - Check msDS-AllowedToActOnBehalfOfOtherIdentity on SQL01
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $comp = Get-ADComputer -Identity "SQL01" -Properties "msDS-AllowedToActOnBehalfOfOtherIdentity"
    if ($comp."msDS-AllowedToActOnBehalfOfOtherIdentity") {
      Write-Output "present"
    } else {
      Write-Output "absent"
    }
  register: result_rbcd_check
  changed_when: false
  failed_when: result_rbcd_check.rc != 0

- name: RBCD - Set msDS-AllowedToActOnBehalfOfOtherIdentity on SQL01 for svc_printer
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $comp = Get-ADComputer -Identity "SQL01"
    $svc  = Get-ADUser   -Identity "svc_printer"
    # PrincipalsAllowedToDelegateToAccount builds the correct binary SD internally
    Set-ADComputer -Identity $comp -PrincipalsAllowedToDelegateToAccount $svc -ErrorAction Stop
    Write-Output "changed: RBCD set on SQL01 for svc_printer"
  when: "'absent' in result_rbcd_check.stdout"
  register: result_rbcd_set
  failed_when: result_rbcd_set.rc != 0
