---
# ==============================================================================
# vuln_linux/defaults/main.yml
# Linux-in-AD member (mandalore). Deliberately vulnerable lab — the weaknesses
# below are the SPEC, not bugs. Lab conventions: empire.local / EMPIRE, admin
# Administrator / SithLord123!, attacker 10.10.0.1, flags EMPIRE{<Office quote>}.
# ==============================================================================

# ── AD / domain join ─────────────────────────────────────────────────────────
vuln_linux_domain:        "empire.local"
vuln_linux_realm:         "empire.local"
vuln_linux_netbios:       "EMPIRE"
vuln_linux_dc_ip:         "10.10.0.10"
vuln_linux_join_user:     "Administrator"
vuln_linux_join_password: "SithLord123!"

# Attempt the realmd/adcli join. If the DC is unreachable the join tasks fail
# soft (the rest of the box — services, LPE, flags — still provisions).
vuln_linux_do_domain_join: true

# ── Attacker / flags ─────────────────────────────────────────────────────────
attacker_ip:  "10.10.0.1"
flag_mode:    "ctf"          # ctf | training (passed via -e by deploy.py)

# ── Resource gating ──────────────────────────────────────────────────────────
# Default-ON services are lightweight (Redis/Memcached/Mongo/MySQL/NFS/web app).
# Heavy JVM/daemon services are OFF by default so they don't OOM a host already
# running 7 Windows VMs. Flip to true (or -e vuln_linux_heavy_services=true) to
# enable Elasticsearch + Jenkins + Docker API.
vuln_linux_heavy_services: false

# Individual toggles (all default-on unless heavy).
vuln_linux_enable_redis:      true
vuln_linux_enable_memcached:  true
vuln_linux_enable_mongodb:    true
vuln_linux_enable_mysql:      true
vuln_linux_enable_nfs:        true
vuln_linux_enable_webapp:     true

# Weak local user (SSH password auth, GTFOBins, etc.)
vuln_linux_weak_user:     "michael"
vuln_linux_weak_password: "Scranton2024!"

# Plaintext domain creds left lying around (Linux→Windows lateral).
vuln_linux_leaked_ad_user: "svc_r2d2"
vuln_linux_leaked_ad_pass: "Droid2024!"
