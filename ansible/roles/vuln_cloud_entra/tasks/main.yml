---
# ==============================================================================
# vuln_cloud_entra/tasks/main.yml — CLO-001..100
# Entra ID / Azure AD hybrid identity surfaces
#
# sync_accounts.yml — coruscant: CLO-001..020 Entra Connect sync account misconfigs
# hybrid_join.yml   — coruscant: CLO-021..040 Azure AD hybrid join surfaces
# app_registrations.yml — coruscant: CLO-041..060 Entra app reg surfaces
# conditional_access.yml — coruscant: CLO-061..080 CA policy bypass surfaces
# cloud_notes.yml   — coruscant: CLO-081..100 additional cloud attack notes
# ==============================================================================

- name: All CLO cloud identity surfaces run on coruscant.empire.local
  ansible.builtin.import_tasks: sync_accounts.yml
  when: inventory_hostname == 'coruscant.empire.local'

- name: Import hybrid join attack surfaces
  ansible.builtin.import_tasks: hybrid_join.yml
  when: inventory_hostname == 'coruscant.empire.local'

- name: Import cloud attack notes (CLO-041..100)
  ansible.builtin.import_tasks: cloud_notes.yml
  when: inventory_hostname == 'coruscant.empire.local'
