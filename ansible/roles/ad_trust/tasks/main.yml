---
# ==============================================================================
# ad_trust/tasks/main.yml
# Configures cross-forest trusts:
#   1. External trust:   empire.local <-> rebel.local
#   2. Tree-root trust:  empire.local <-> trade.corp  (Forest trust type)
#
# INTENTIONAL MISCONFIGURATIONS (do not remove):
#   - SIDFilteringForestAware  = $false  \
#   - SIDFilteringQuarantined  = $false  /  DF-008: SID filtering bypass
#
# Run on: coruscant.empire.local (initiating side for both trusts)
# ==============================================================================

# --------------------------------------------------------------------------
# Preconditions: remote DCs must answer LDAP before trust negotiation
# --------------------------------------------------------------------------

- name: Assert rebel.local DC is reachable on LDAP
  ansible.windows.win_shell: |
    $tcp = Test-NetConnection -ComputerName {{ finance_dc_ip }} -Port 389 -WarningAction SilentlyContinue
    if ($tcp.TcpTestSucceeded) { Write-Output "READY" } else { Write-Output "FAIL"; exit 1 }
  register: finance_ldap
  changed_when: false
  failed_when: "'READY' not in finance_ldap.stdout"
  retries: 10
  delay: 30

- name: Assert trade.corp DC is reachable on LDAP
  ansible.windows.win_shell: |
    $tcp = Test-NetConnection -ComputerName {{ root_dc_ip }} -Port 389 -WarningAction SilentlyContinue
    if ($tcp.TcpTestSucceeded) { Write-Output "READY" } else { Write-Output "FAIL"; exit 1 }
  register: root_ldap
  changed_when: false
  failed_when: "'READY' not in root_ldap.stdout"
  retries: 10
  delay: 30

# --------------------------------------------------------------------------
# Trust 1: empire.local <-> rebel.local  (External)
# --------------------------------------------------------------------------

- name: Check if corp<->finance trust already exists
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $t = Get-ADTrust -Filter "Target -eq 'rebel.local'" -ErrorAction SilentlyContinue
    if ($t) { Write-Output "EXISTS" } else { Write-Output "MISSING" }
  register: finance_trust_check
  changed_when: false

- name: Create external trust empire.local <-> rebel.local
  # NOTE: there is no New-ADTrust cmdlet. External (domain-to-domain) trusts are
  # created with the .NET Domain.CreateTrustRelationship API, which builds BOTH
  # sides in one call given target-forest credentials.
  ansible.windows.win_shell: |
    $ErrorActionPreference = "Stop"
    try {
      $srcCtx = New-Object System.DirectoryServices.ActiveDirectory.DirectoryContext(
        "Domain", "empire.local", "{{ corp_admin_user }}", "{{ corp_admin_password }}")
      $tgtCtx = New-Object System.DirectoryServices.ActiveDirectory.DirectoryContext(
        "Domain", "rebel.local", "{{ finance_admin_user }}", "{{ finance_admin_password }}")
      $src = [System.DirectoryServices.ActiveDirectory.Domain]::GetDomain($srcCtx)
      $tgt = [System.DirectoryServices.ActiveDirectory.Domain]::GetDomain($tgtCtx)
      $src.CreateTrustRelationship(
        $tgt, [System.DirectoryServices.ActiveDirectory.TrustDirection]::Bidirectional)
      Write-Output "TRUST_CREATED: empire.local <-> rebel.local"
    } catch {
      # PowerShell wraps the .NET method exception, so match on the message.
      $msg = "$($_.Exception.Message) $($_.Exception.InnerException.Message)"
      if ($msg -match 'trust relationship exists|already exists') {
        Write-Output "TRUST_EXISTS: empire.local <-> rebel.local"
      } else { Write-Error $_; exit 1 }
    }
  register: finance_trust_create
  changed_when: "'TRUST_CREATED' in finance_trust_create.stdout"
  failed_when: finance_trust_create.rc != 0
  when: finance_trust_check.stdout | trim == "MISSING"

# DF-008: Disable SID filtering on the corp<->finance trust.
# SIDFilteringForestAware=$false and SIDFilteringQuarantined=$false allow
# attackers to inject SID history and escalate across the forest boundary.
- name: Disable SID filtering on corp<->finance trust (DF-008 intentional)
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    # SIDFilteringQuarantined controls quarantine (external trust SID filter)
    # SIDFilteringForestAware controls the forest-aware SID filter flag
    Set-ADObject -Identity (Get-ADTrust -Filter "Target -eq 'rebel.local'").DistinguishedName `
      -Replace @{ "msDS-TrustForestTrustInfo" = $null } `
      -ErrorAction SilentlyContinue

    netdom trust empire.local /domain:rebel.local /quarantine:no /usero:Administrator /passwordo:"{{ corp_admin_password }}"
    Write-Output "SID_FILTER_DISABLED: rebel.local"
  register: finance_sidfilt
  changed_when: true
  when: not sid_filtering_enabled

# --------------------------------------------------------------------------
# Trust 2: empire.local <-> trade.corp  (Forest / tree-root)
# --------------------------------------------------------------------------

- name: Check if corp<->root trust already exists
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $t = Get-ADTrust -Filter "Target -eq 'trade.corp'" -ErrorAction SilentlyContinue
    if ($t) { Write-Output "EXISTS" } else { Write-Output "MISSING" }
  register: root_trust_check
  changed_when: false

- name: Create forest trust empire.local <-> trade.corp
  # NOTE: there is no New-ADTrust cmdlet. A transitive forest trust is created
  # with the .NET Forest.CreateTrustRelationship API (builds both sides at once).
  ansible.windows.win_shell: |
    $ErrorActionPreference = "Stop"
    try {
      $srcCtx = New-Object System.DirectoryServices.ActiveDirectory.DirectoryContext(
        "Forest", "empire.local", "{{ corp_admin_user }}", "{{ corp_admin_password }}")
      $tgtCtx = New-Object System.DirectoryServices.ActiveDirectory.DirectoryContext(
        "Forest", "trade.corp", "{{ jedi_admin_user }}", "{{ jedi_admin_password }}")
      $src = [System.DirectoryServices.ActiveDirectory.Forest]::GetForest($srcCtx)
      $tgt = [System.DirectoryServices.ActiveDirectory.Forest]::GetForest($tgtCtx)
      $src.CreateTrustRelationship(
        $tgt, [System.DirectoryServices.ActiveDirectory.TrustDirection]::Bidirectional)
      Write-Output "TRUST_CREATED: empire.local <-> trade.corp"
    } catch {
      $msg = "$($_.Exception.Message) $($_.Exception.InnerException.Message)"
      if ($msg -match 'trust relationship exists|already exists') {
        Write-Output "TRUST_EXISTS: empire.local <-> trade.corp"
      } else { Write-Error $_; exit 1 }
    }
  register: root_trust_create
  changed_when: "'TRUST_CREATED' in root_trust_create.stdout"
  failed_when: root_trust_create.rc != 0
  when: root_trust_check.stdout | trim == "MISSING"

# DF-008: Disable SID filtering on the corp<->root trust.
- name: Disable SID filtering on corp<->root trust (DF-008 intentional)
  ansible.windows.win_shell: |
    # netdom is the reliable way to toggle quarantine/SIDfilter on forest trusts
    netdom trust empire.local /domain:trade.corp /quarantine:no /usero:Administrator /passwordo:"{{ corp_admin_password }}"
    netdom trust empire.local /domain:trade.corp /enablesidhistory:yes /usero:Administrator /passwordo:"{{ corp_admin_password }}"
    Write-Output "SID_FILTER_DISABLED: trade.corp"
  register: root_sidfilt
  changed_when: true
  when: not sid_filtering_enabled

# --------------------------------------------------------------------------
# Verification
# --------------------------------------------------------------------------

- name: Verify all trusts are present
  ansible.windows.win_shell: |
    nltest /domain_trusts /all_trusts
  register: trust_verify
  changed_when: false
