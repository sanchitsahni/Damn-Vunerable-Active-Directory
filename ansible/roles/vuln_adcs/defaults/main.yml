---
# ==============================================================================
# vuln_adcs/defaults/main.yml
# ==============================================================================

ad_domain:  "empire.local"
ad_basedn:  "DC=empire,DC=local"
ca_name:    "corp-CA"
ca_host:    "endor.empire.local"

# ADCS configuration naming context (used in LDAP searches for templates)
config_nc:  "CN=Certificate Templates,CN=Public Key Services,CN=Services,CN=Configuration,DC=empire,DC=local"

# Template names — referenced across templates.yml and ca-flags.yml
esc1_template:    "DVADUserESC1"
esc2_template:    "DVADMachineESC2"
esc3_template:    "DVADAgentESC3"
esc4_template:    "DVADWriteESC4"
esc13_template:   "DVADIssuanceESC13"
esc15_template:   "DVADNoSecExtESC15"

# Unique per-template OIDs — each template must have a distinct OID or ADCS will
# reject enrollment.  These are lab-local OIDs (prefix 1.3.6.1.4.1.311.21.8.);
# the last decimal is the template slot number so they never collide.
esc1_oid:  "1.3.6.1.4.1.311.21.8.99887761.12345671.1"
esc2_oid:  "1.3.6.1.4.1.311.21.8.99887761.12345671.2"
esc3_oid:  "1.3.6.1.4.1.311.21.8.99887761.12345671.3"
esc4_oid:  "1.3.6.1.4.1.311.21.8.99887761.12345671.4"
esc13_oid: "1.3.6.1.4.1.311.21.8.99887761.12345671.13"
esc15_oid: "1.3.6.1.4.1.311.21.8.99887761.12345671.15"

# CA manager account for ESC7
ca_manager_user:  "svc_bobafett"

# ADCS web enrollment site path in IIS
certsrv_iis_path: "IIS:\\Sites\\Default Web Site\\CertSrv"
