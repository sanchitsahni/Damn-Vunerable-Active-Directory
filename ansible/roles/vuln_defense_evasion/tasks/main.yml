---
# ==============================================================================
# vuln_defense_evasion/tasks/main.yml — DEF-001..080, C2-001..030, EXF-001..030
#
# amsi_etw.yml   — all hosts: DEF-001..020 AMSI/ETW/AV bypass surfaces
# logging.yml    — all hosts: DEF-021..040 logging weakness misconfigs
# applocker.yml  — tatooine/scarif: DEF-041..060 AppLocker bypass paths
# c2_exfil.yml   — all hosts: DEF-061..080 + C2-001..030 + EXF-001..030 notes
# ==============================================================================

- name: Import AMSI/ETW bypass surface tasks
  ansible.builtin.import_tasks: amsi_etw.yml

- name: Import logging weakness tasks
  ansible.builtin.import_tasks: logging.yml

- name: Import AppLocker bypass path tasks
  ansible.builtin.import_tasks: applocker.yml
  when: inventory_hostname in ['tatooine.empire.local', 'scarif.empire.local']

- name: Import C2/exfil surface notes
  ansible.builtin.import_tasks: c2_exfil.yml
  when: inventory_hostname == 'coruscant.empire.local'
