---
# ==============================================================================
# vuln_exchange/tasks/db_setup.yml — ImperialArchive database creation
# Target: kamino.empire.local
#
# Must run AFTER sql.yml (which enables sa + sqlcmd).
# Creates ImperialArchive database with:
#   - users / employees / credentials / products / orders tables
#   - empire_web SQL login (low-priv, for web app)
#   - Vulnerable stored procedures (SQLi, exec, impersonation)
#   - Fake PII data for realism
# ==============================================================================

- name: DB-SETUP - Check sqlcmd availability before DB creation
  ansible.windows.win_shell: |
    $cmd = Get-Command sqlcmd.exe -ErrorAction SilentlyContinue
    if ($cmd) { Write-Output "available" } else { Write-Output "not_found" }
  register: db_sqlcmd_check
  changed_when: false
  failed_when: db_sqlcmd_check.rc != 0

- name: DB-SETUP - Create ImperialArchive database and schema
  ansible.windows.win_shell: |
    sqlcmd -S localhost -U sa -P "{{ sql_sa_password }}" -Q "
      -- Drop and recreate ImperialArchive
      IF DB_ID('ImperialArchive') IS NOT NULL DROP DATABASE ImperialArchive;
      CREATE DATABASE ImperialArchive;
    " 2>&1
    Write-Output "changed: ImperialArchive database created"
  register: db_create
  changed_when: "'changed:' in db_create.stdout"
  failed_when: db_create.rc != 0 and 'already exists' not in db_create.stderr
  when: "'available' in db_sqlcmd_check.stdout"

- name: DB-SETUP - Create tables and populate with fake data
  ansible.windows.win_shell: |
    sqlcmd -S localhost -U sa -P "{{ sql_sa_password }}" -d ImperialArchive -Q "
      -- ================================================================
      -- users table (login credentials — SQLi target)
      -- ================================================================
      IF OBJECT_ID('dbo.users', 'U') IS NULL
      CREATE TABLE dbo.users (
        id          INT IDENTITY(1,1) PRIMARY KEY,
        username    VARCHAR(50)  NOT NULL,
        password    VARCHAR(100) NOT NULL,  -- plaintext (intentionally weak)
        email       VARCHAR(100),
        role        VARCHAR(20)  DEFAULT 'user',
        created_at  DATETIME     DEFAULT GETDATE()
      );

      -- Truncate and reload for idempotency
      DELETE FROM dbo.users;
      INSERT INTO dbo.users (username, password, email, role) VALUES
        ('admin',       'SithLord123!',   'admin@empire.local',      'admin'),
        ('luke.skywalker',        'SithLord123!',   'luke.skywalker@empire.local',       'user'),
        ('svc_c3po',     'WebService2024!','svc_c3po@empire.local',    'service'),
        ('finance_mgr', 'Finance2024!',   'fin@rebel.local',     'manager'),
        ('sa_backup',   'Bossk2024!',    'backup@empire.local',     'user');

      -- ================================================================
      -- employees table
      -- ================================================================
      IF OBJECT_ID('dbo.employees', 'U') IS NULL
      CREATE TABLE dbo.employees (
        id        INT IDENTITY(1,1) PRIMARY KEY,
        name      VARCHAR(100),
        dept      VARCHAR(50),
        salary    DECIMAL(10,2),
        ssn       VARCHAR(15),    -- fake SSN — PII surface
        manager   VARCHAR(100)
      );

      DELETE FROM dbo.employees;
      INSERT INTO dbo.employees (name, dept, salary, ssn, manager) VALUES
        ('Luke Skywalker',        'IT',       85000.00, '123-45-6789', 'Ahsoka Tano'),
        ('Jane Smith',      'Finance',  92000.00, '987-65-4321', 'Bob Jones'),
        ('Mike Johnson',    'HR',       78000.00, '456-78-9012', 'Ahsoka Tano'),
        ('Sarah Connor',    'IT',      110000.00, '321-54-9876', NULL),
        ('David Brown',     'Finance',  88000.00, '654-32-1098', 'Bob Jones'),
        ('Emily Davis',     'IT',       95000.00, '789-01-2345', 'Sarah Connor');

      -- ================================================================
      -- credentials table (exposed secrets for CRED attack vectors)
      -- ================================================================
      IF OBJECT_ID('dbo.credentials', 'U') IS NULL
      CREATE TABLE dbo.credentials (
        id       INT IDENTITY(1,1) PRIMARY KEY,
        service  VARCHAR(100),
        username VARCHAR(100),
        password VARCHAR(200),
        notes    VARCHAR(500)
      );

      DELETE FROM dbo.credentials;
      INSERT INTO dbo.credentials (service, username, password, notes) VALUES
        ('Active Directory',  'Administrator',   'SithLord123!',   'Domain Admin -- do not change'),
        ('MSSQL',             'sa',              'DeathStar2025!', 'SQL SA account'),
        ('WinRM',             'svc_bobafett',      'Bossk2024!',    'Backup service account'),
        ('IIS AppPool',       'svc_iis',         'IIS2024!',       'Web app pool'),
        ('Monitoring',        'svc_monitoring',  'Monitor2024!',   'Grafana/monitoring');

      -- ================================================================
      -- products table (for union-based SQLi exercises)
      -- ================================================================
      IF OBJECT_ID('dbo.products', 'U') IS NULL
      CREATE TABLE dbo.products (
        id          INT IDENTITY(1,1) PRIMARY KEY,
        name        VARCHAR(100),
        price       DECIMAL(8,2),
        description VARCHAR(500),
        stock       INT
      );

      DELETE FROM dbo.products;
      INSERT INTO dbo.products (name, price, description, stock) VALUES
        ('Widget A', 9.99,  'Standard widget for corporate use', 100),
        ('Gadget B', 24.99, 'Advanced gadget, limited edition',  50),
        ('Tool C',   49.99, 'Professional tooling kit',          25);
    " 2>&1
    Write-Output "changed: tables created and populated"
  register: db_tables
  changed_when: "'changed:' in db_tables.stdout"
  failed_when: db_tables.rc != 0
  when: "'available' in db_sqlcmd_check.stdout"

- name: DB-SETUP - Create empire_web SQL login and user
  ansible.windows.win_shell: |
    sqlcmd -S localhost -U sa -P "{{ sql_sa_password }}" -d ImperialArchive -Q "
      -- Create low-priv web app login
      IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name = 'empire_web')
        CREATE LOGIN empire_web WITH PASSWORD = 'WebUser2024!', CHECK_POLICY = OFF;

      IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = 'empire_web')
        CREATE USER empire_web FOR LOGIN empire_web;

      -- Grant minimal permissions (read all + exec stored procs)
      GRANT SELECT ON dbo.users      TO empire_web;
      GRANT SELECT ON dbo.employees  TO empire_web;
      GRANT SELECT ON dbo.products   TO empire_web;
      GRANT SELECT ON dbo.credentials TO empire_web;
      GRANT EXECUTE TO empire_web;
    " 2>&1
    Write-Output "changed: empire_web login created"
  register: db_login
  changed_when: "'changed:' in db_login.stdout"
  failed_when: db_login.rc != 0
  when: "'available' in db_sqlcmd_check.stdout"

- name: DB-SETUP - Create vulnerable stored procedures
  ansible.windows.win_shell: |
    sqlcmd -S localhost -U sa -P "{{ sql_sa_password }}" -d ImperialArchive -Q "
      -- ================================================================
      -- sp_login: Vulnerable login proc (string concatenation = SQLi)
      -- ================================================================
      IF OBJECT_ID('dbo.sp_login', 'P') IS NOT NULL DROP PROC dbo.sp_login;
    " 2>&1

    sqlcmd -S localhost -U sa -P "{{ sql_sa_password }}" -d ImperialArchive -Q "
      CREATE PROC dbo.sp_login
        @username VARCHAR(50),
        @password VARCHAR(100)
      AS
      BEGIN
        DECLARE @sql NVARCHAR(500);
        -- VULNERABLE: string concatenation allows SQLi
        SET @sql = 'SELECT id, username, role FROM dbo.users WHERE username=''' +
                   @username + ''' AND password=''' + @password + '''';
        EXEC sp_executesql @sql;
      END
    " 2>&1
    Write-Output "changed: stored procedures created"
  register: db_procs
  changed_when: "'changed:' in db_procs.stdout"
  failed_when: db_procs.rc != 0
  when: "'available' in db_sqlcmd_check.stdout"

- name: DB-SETUP - Create EXECUTE AS OWNER impersonation proc (SRV-019)
  ansible.windows.win_shell: |
    sqlcmd -S localhost -U sa -P "{{ sql_sa_password }}" -d ImperialArchive -Q "
      -- Make ImperialArchive TRUSTWORTHY for cross-DB escalation
      ALTER DATABASE ImperialArchive SET TRUSTWORTHY ON;

      IF OBJECT_ID('dbo.sp_escalate', 'P') IS NOT NULL DROP PROC dbo.sp_escalate;
    " 2>&1

    sqlcmd -S localhost -U sa -P "{{ sql_sa_password }}" -d ImperialArchive -Q "
      CREATE PROC dbo.sp_escalate
      WITH EXECUTE AS OWNER
      AS
      BEGIN
        -- Runs as dbo (db_owner) — privilege escalation via TRUSTWORTHY DB
        EXEC master..xp_cmdshell 'whoami';
      END;
      GRANT EXECUTE ON dbo.sp_escalate TO empire_web;
    " 2>&1
    Write-Output "changed: escalation proc created"
  register: db_escalate
  changed_when: "'changed:' in db_escalate.stdout"
  failed_when: db_escalate.rc != 0
  when: "'available' in db_sqlcmd_check.stdout"

- name: DB-SETUP - Create SQL Agent job with OS exec (SRV-009)
  ansible.windows.win_shell: |
    sqlcmd -S localhost -U sa -P "{{ sql_sa_password }}" -Q "
      USE msdb;
      IF NOT EXISTS (SELECT 1 FROM msdb.dbo.sysjobs WHERE name = 'Empire_Backdoor_Job')
      BEGIN
        EXEC msdb.dbo.sp_add_job
          @job_name = 'Empire_Backdoor_Job',
          @description = 'SRV-009: SQL Agent job with OS command execution';

        EXEC msdb.dbo.sp_add_jobstep
          @job_name = 'Empire_Backdoor_Job',
          @step_name = 'RunCmd',
          @subsystem = 'CmdExec',
          @command = 'cmd /c echo EMPIRE-SRV-009 > C:\Flags\sqlagent_ran.txt';

        EXEC msdb.dbo.sp_add_schedule
          @schedule_name = 'Never',
          @freq_type = 1;

        EXEC msdb.dbo.sp_attach_schedule
          @job_name = 'Empire_Backdoor_Job',
          @schedule_name = 'Never';

        EXEC msdb.dbo.sp_add_jobserver
          @job_name = 'Empire_Backdoor_Job',
          @server_name = @@SERVERNAME;
      END
    " 2>&1
    Write-Output "changed: SQL Agent job created"
  register: db_agent
  changed_when: "'changed:' in db_agent.stdout"
  failed_when: false
  when: "'available' in db_sqlcmd_check.stdout"

- name: DB-SETUP - Drop setup note
  ansible.windows.win_copy:
    dest: 'C:\Flags\FLAG-DB-SETUP.txt'
    content: |
      ImperialArchive Database — Attack Surfaces
      ======================================
      Database:     ImperialArchive on kamino.empire.local:1433
      Web app user: empire_web / WebUser2024!    (SELECT + EXEC only)
      Admin:        sa / DeathStar2025!        (full sysadmin)

      Tables:
        dbo.users        — login credentials in PLAINTEXT (union/blind SQLi target)
        dbo.employees    — PII (name, SSN, salary) — data exfil target
        dbo.credentials  — service account passwords
        dbo.products     — union-based SQLi practice

      Vulnerable stored procedures:
        dbo.sp_login(user, pass)  — string concatenation SQLi
        dbo.sp_escalate()         — EXECUTE AS OWNER + xp_cmdshell (SRV-019)

      SQL Agent:
        Empire_Backdoor_Job — CmdExec step, trigger manually to execute OS commands

      Attack chain (web → OS):
        1. sqli.aspx?id=1' UNION SELECT username,password,role FROM credentials--
        2. Access sa via credential → xp_cmdshell → OS command execution
        3. Shell as MSSQL service account → privilege escalation