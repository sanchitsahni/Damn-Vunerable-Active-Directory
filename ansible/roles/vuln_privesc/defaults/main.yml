# empire.local NetBIOS name (used for NTAccount -> SID translation in secedit)
ad_domain_netbios: "EMPIRE"

# World-writable tools directory used by several privesc surfaces (PE-061, etc.)
tools_dir: 'C:\Tools'

# PE-061: auto-run entry pointing at a binary in the world-writable tools dir
autorun_target: 'C:\Tools\empire_autorun.exe'

# Service-account passwords for privilege-assignment surfaces (intentionally weak)
svc_jabba_password: "SithLord123!"
svc_tcb_password: "SithLord123!"
svc_quota_password: "SithLord123!"
