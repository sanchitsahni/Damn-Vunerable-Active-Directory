---
# ==============================================================================
# vuln_privesc/tasks/services.yml
# Targets: file01.corp.local (primary), ws01.corp.local (task scheduler vuln)
#
# PE-007  Unquoted service path — VulnService with path containing spaces
# PE-008  Weak service DACL — VulnService registry key writable by Authenticated Users
# PE-030  Binary replacement via world-writable C:\Tools (ToolService)
# ==============================================================================

# ------------------------------------------------------------------------------
# PE-007: Unquoted service path on file01
# Path: C:\Program Files\Vuln Service\service.exe  (no quotes -> plant C:\Program.exe)
# ------------------------------------------------------------------------------
- name: PE-007 - Create unquoted-path service directory on file01
  ansible.windows.win_file:
    path: 'C:\Program Files\Vuln Service'
    state: directory
  when: inventory_hostname == 'file01.corp.local'

- name: PE-007 - Stage placeholder binary for VulnService
  ansible.windows.win_copy:
    dest: 'C:\Program Files\Vuln Service\service.exe'
    content: ''
  when: inventory_hostname == 'file01.corp.local'

- name: PE-007 - Create VulnService with unquoted binary path
  ansible.windows.win_shell: |
    $svc = Get-Service -Name "VulnService" -ErrorAction SilentlyContinue
    if (-not $svc) {
      sc.exe create VulnService binpath= "C:\Program Files\Vuln Service\service.exe" `
        start= auto | Out-Null
      Write-Output "changed: VulnService created"
    } else {
      Write-Output "ok: VulnService already exists"
    }
  register: result_vulnsvc
  changed_when: "'changed:' in result_vulnsvc.stdout"
  failed_when: result_vulnsvc.rc != 0
  when: inventory_hostname == 'file01.corp.local'

- name: PE-007 - Grant C:\ write to BUILTIN\Users (plant unquoted-path binary)
  ansible.windows.win_shell: |
    icacls C:\ /grant "BUILTIN\Users:(W)" 2>$null | Out-Null
  when: inventory_hostname == 'file01.corp.local'
  changed_when: false

# ------------------------------------------------------------------------------
# PE-008: Weak service DACL on VulnService
# SD string grants WD (Everyone) RP/WP/DT/LO (start, stop, config change, query)
# so any domain user can reconfigure the service binary path.
# ------------------------------------------------------------------------------
- name: PE-008 - Set weak DACL on VulnService (Everyone can ChangeConfig)
  ansible.windows.win_shell: |
    # D: DACL; WD = World/Everyone; RP=QueryConfig WP=ChangeConfig DT=PauseResume LO=Interrogate
    $sd = 'D:(A;;CCLCSWRPWPDTLOCRRC;;;SY)(A;;CCDCLCSWRPWPDTLOCRSDRCWDWO;;;BA)(A;;CCLCSWLOCRRC;;;IU)(A;;CCLCSWLOCRRC;;;SU)(A;;RPWPDTLO;;;WD)'
    $result = sc.exe sdset VulnService $sd
    if ($LASTEXITCODE -ne 0) { Write-Error "sc.exe sdset failed: $result" }
  when: inventory_hostname == 'file01.corp.local'
  register: result_pe008
  failed_when: result_pe008.rc != 0

# ------------------------------------------------------------------------------
# PE-008: Service registry key writable by Authenticated Users
# ------------------------------------------------------------------------------
- name: PE-008 - Grant Authenticated Users SetValue on VulnService registry key
  ansible.windows.win_shell: |
    $keyPath = "HKLM:\SYSTEM\CurrentControlSet\Services\VulnService"
    if (Test-Path $keyPath) {
      $acl  = Get-Acl $keyPath
      $rule = New-Object System.Security.AccessControl.RegistryAccessRule(
                "NT AUTHORITY\Authenticated Users", "SetValue", "Allow")
      $acl.AddAccessRule($rule)
      Set-Acl $keyPath $acl
    }
  when: inventory_hostname == 'file01.corp.local'
  register: result_pe008_reg
  failed_when: result_pe008_reg.rc != 0

# ------------------------------------------------------------------------------
# PE-030: World-writable C:\Tools (DLL/PATH hijack via ToolService)
# ------------------------------------------------------------------------------
- name: PE-030 - Stage C:\Tools world-writable directory and ToolService
  ansible.windows.win_shell: |
    New-Item -ItemType Directory -Path "C:\Tools" -Force | Out-Null
    icacls "C:\Tools" /grant "Everyone:(OI)(CI)F" 2>$null | Out-Null

    Set-Content -Path "C:\Tools\toolsvc.exe" -Value "" -Force

    $svc = Get-Service -Name "ToolService" -ErrorAction SilentlyContinue
    if (-not $svc) {
      New-Service -Name "ToolService" -BinaryPathName "C:\Tools\toolsvc.exe" `
        -StartupType Manual | Out-Null
    }

    # Prepend C:\Tools to system PATH for DLL search-order hijack
    $cur = [Environment]::GetEnvironmentVariable("Path", "Machine")
    if ($cur -notlike "*C:\Tools*") {
      [Environment]::SetEnvironmentVariable("Path", "C:\Tools;$cur", "Machine")
    }
  when: inventory_hostname == 'file01.corp.local'
  register: result_tools
  changed_when: false
  failed_when: result_tools.rc != 0

# ------------------------------------------------------------------------------
# PE-030: Weak DACL on ToolService registry key
# ------------------------------------------------------------------------------
- name: PE-030 - Grant Users SetValue on ToolService registry key
  ansible.windows.win_shell: |
    $keyPath = "HKLM:\SYSTEM\CurrentControlSet\Services\ToolService"
    if (Test-Path $keyPath) {
      $acl  = Get-Acl $keyPath
      $rule = New-Object System.Security.AccessControl.RegistryAccessRule(
                "BUILTIN\Users", "SetValue", "Allow")
      $acl.AddAccessRule($rule)
      Set-Acl $keyPath $acl
    }
  when: inventory_hostname == 'file01.corp.local'
  register: result_toolsvc_reg
  failed_when: result_toolsvc_reg.rc != 0

# ------------------------------------------------------------------------------
# Writable scheduled-task action on ws01 (PE-016)
# ------------------------------------------------------------------------------
- name: PE-016 - Create C:\VulnTasks and writable task action on ws01
  ansible.windows.win_shell: |
    New-Item -ItemType Directory -Path "C:\VulnTasks" -Force | Out-Null
    Set-Content -Path "C:\VulnTasks\sync.bat" `
      -Value "@echo off`r`nrem placeholder - overwrite to escalate`r`nexit /b 0" -Force
    icacls "C:\VulnTasks" /grant "BUILTIN\Users:(OI)(CI)F" | Out-Null
    schtasks /Create /TN "CorpSync" /TR "C:\VulnTasks\sync.bat" /SC ONSTART /RU SYSTEM /F | Out-Null
  when: inventory_hostname == 'ws01.corp.local'
  register: result_vulntask
  changed_when: false
  failed_when: result_vulntask.rc != 0
