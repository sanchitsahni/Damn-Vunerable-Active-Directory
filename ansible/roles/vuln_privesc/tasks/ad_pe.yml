---
# ==============================================================================
# vuln_privesc/tasks/ad_pe.yml  —  coruscant.empire.local (import already gated)
# BATCHED: one templated run instead of ~4 WinRM round-trips.
# Logic in templates/ad_pe.ps1.j2 (PE-123, PE-126, PE-128).
# ==============================================================================

- name: PE-ad - Ensure DunderLab dir exists
  ansible.windows.win_file:
    path: C:\DunderLab
    state: directory

- name: PE-ad - Render batched AD-PE script
  ansible.windows.win_template:
    src: ad_pe.ps1.j2
    dest: C:\DunderLab\ad_pe.ps1

- name: PE-ad - Run batched AD-PE script (PE-123/126/128)
  ansible.windows.win_shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\DunderLab\ad_pe.ps1
  register: pe_ad_run
  changed_when: "'CHANGED:' in pe_ad_run.stdout"
  failed_when: "'DONE' not in pe_ad_run.stdout"
