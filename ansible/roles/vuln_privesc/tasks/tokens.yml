---
# ==============================================================================
# vuln_privesc/tasks/tokens.yml  —  all Windows hosts
# BATCHED: one templated run instead of 2 WinRM round-trips (PE-081..100).
# Logic in templates/tokens.ps1.j2 (secedit privilege grants + abuse note).
# ==============================================================================

- name: PE-tokens - Ensure EmpireLab dir exists
  ansible.windows.win_file:
    path: C:\EmpireLab
    state: directory

- name: PE-tokens - Render batched token-PE script
  ansible.windows.win_template:
    src: tokens.ps1.j2
    dest: C:\EmpireLab\tokens_pe.ps1

- name: PE-tokens - Run batched token-PE script (PE-081..100)
  ansible.windows.win_shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\EmpireLab\tokens_pe.ps1
  register: pe_tokens_run
  changed_when: "'CHANGED:' in pe_tokens_run.stdout"
  failed_when: "'DONE' not in pe_tokens_run.stdout"
