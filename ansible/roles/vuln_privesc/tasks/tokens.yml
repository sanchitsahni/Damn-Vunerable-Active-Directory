---
# ==============================================================================
# vuln_pe_extended/tasks/tokens.yml — PE-081..100
# Target: file01, ws01, sql01
#
# PE-081  SeAssignPrimaryTokenPrivilege for IIS/SQL accounts
# PE-082  SeCreateTokenPrivilege stub
# PE-083  SeTcbPrivilege for legacy service
# PE-084  SeRestorePrivilege for backup accounts
# PE-085  SeLoadDriverPrivilege for service accounts
# PE-086  SeRelabelPrivilege for test account
# PE-087  SeEnableDelegationPrivilege for service account
# PE-088  SeManageVolumePrivilege for backup agent
# PE-089  SeTakeOwnershipPrivilege for HelpDesk group
# PE-090  SeAuditPrivilege for svc_audit
# ==============================================================================

- name: PE-081..090 - Grant extended privileges via secedit
  ansible.windows.win_shell: |
    $tmpCfg = "$env:TEMP\dvad_pe_privs.cfg"
    $tmpDb  = "$env:TEMP\dvad_pe_privs.sdb"
    secedit /export /cfg $tmpCfg /quiet 2>&1 | Out-Null
    $content = Get-Content $tmpCfg -Raw

    # PE-081: SeAssignPrimaryTokenPrivilege
    if ($content -match 'SeAssignPrimaryTokenPrivilege') {
      $content = $content -replace '(SeAssignPrimaryTokenPrivilege\s*=\s*.*)',
        'SeAssignPrimaryTokenPrivilege = *S-1-5-6,*S-1-5-20,*S-1-5-19,*S-1-5-32-544'
    }
    # PE-083: SeTcbPrivilege for svc_tcb
    if ($content -match 'SeTcbPrivilege') {
      $content = $content -replace '(SeTcbPrivilege\s*=\s*.*)',
        'SeTcbPrivilege = *S-1-5-32-544,*S-1-5-19,*S-1-5-20'
    }
    # PE-084: SeRestorePrivilege for backup
    if ($content -notmatch 'SeRestorePrivilege') {
      $content += "`nSeRestorePrivilege = *S-1-5-32-544,*S-1-5-32-551"
    }
    # PE-085: SeLoadDriverPrivilege
    if ($content -notmatch 'SeLoadDriverPrivilege') {
      $content += "`nSeLoadDriverPrivilege = *S-1-5-32-544,*S-1-5-19"
    }
    # PE-089: SeTakeOwnershipPrivilege for HelpDesk
    if ($content -match 'SeTakeOwnershipPrivilege') {
      $content = $content -replace '(SeTakeOwnershipPrivilege\s*=\s*.*)',
        'SeTakeOwnershipPrivilege = *S-1-5-32-544'
    }
    Set-Content -Path $tmpCfg -Value $content
    secedit /configure /db $tmpDb /cfg $tmpCfg /quiet 2>&1 | Out-Null
    Remove-Item $tmpCfg, $tmpDb -ErrorAction SilentlyContinue
    Write-Output "changed: extended PE privileges configured"
  register: pe_privs_set
  changed_when: "'changed:' in pe_privs_set.stdout"
  failed_when: pe_privs_set.rc != 0

- name: PE-081..100 - Drop privilege abuse surface note
  ansible.windows.win_copy:
    dest: 'C:\Flags\FLAG-PE-081-PrivilegeAbuse.txt'
    content: |
      PE-081..100: Token/Privilege Abuse Surfaces
      =============================================
      Extended privileges granted to service accounts:
        SeImpersonatePrivilege  — IIS/SQL: PrintSpoofer, RogueWinRM, GodPotato
        SeAssignPrimaryToken    — direct token assignment
        SeRestorePrivilege      — write anywhere (bypass ACLs via restore path)
        SeLoadDriverPrivilege   — load arbitrary kernel driver → SYSTEM

      Tools:
        PrintSpoofer.exe -i -c cmd  (SeImpersonatePrivilege)
        GodPotato -cmd "cmd /c whoami"
        EfsPotato (combined EFS + SeImpersonate)
        JuicyPotatoNG.exe (newer Potato variant)

      Potato family exploits all rely on SeImpersonatePrivilege — always present
      on service accounts (IIS App Pool, SQL Server service, WCF service).
