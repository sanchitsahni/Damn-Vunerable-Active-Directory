# ------------------------------------------------------------------------------
# PE-058: Print Operators — Print_Ops local group + print_user member.
# Print Operators on a DC can load printer drivers, which run as SYSTEM.
# We create a local group Print_Ops on scarif and add it to the builtin
# Print Operators group, plus create a low-priv print_user to demonstrate.
# ------------------------------------------------------------------------------
- name: PE-058 - Ensure print_user AD account exists
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    if (-not (Get-ADUser -Filter "SamAccountName -eq 'print_user'" -ErrorAction SilentlyContinue)) {
      New-ADUser -Name "print_user" -SamAccountName "print_user" `
        -AccountPassword (ConvertTo-SecureString "PrintUser2024!" -AsPlainText -Force) `
        -Enabled $true -PasswordNeverExpires $true `
        -Path "CN=Users,DC=empire,DC=local" -ErrorAction SilentlyContinue
      Write-Output "changed: print_user created"
    } else {
      Write-Output "ok: print_user exists"
    }
  delegate_to: coruscant.empire.local
  run_once: true
  register: result_print_user_create
  changed_when: "'changed:' in result_print_user_create.stdout"
  failed_when: result_print_user_create.rc != 0
  when: inventory_hostname == 'scarif.empire.local'

- name: PE-058 - Ensure Print_Ops local group exists on scarif
  ansible.windows.win_shell: |
    $g = Get-LocalGroup -Name "Print_Ops" -ErrorAction SilentlyContinue
    if (-not $g) {
      New-LocalGroup -Name "Print_Ops" -Description "EMPIRE Print Ops (PE-058)" | Out-Null
      Write-Output "changed: Print_Ops created"
    } else {
      Write-Output "ok: Print_Ops exists"
    }
  when: inventory_hostname == 'scarif.empire.local'
  register: result_printops_group
  changed_when: "'changed:' in result_printops_group.stdout"
  failed_when: result_printops_group.rc != 0

- name: PE-058 - Add print_user to Print_Ops local group on scarif
  ansible.windows.win_shell: |
