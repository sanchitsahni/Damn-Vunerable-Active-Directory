---
# ==============================================================================
# vuln_privesc_ext/tasks/privileges.yml
# Targets: scarif.empire.local (secedit user-rights grants), coruscant.empire.local
#          (group membership for Asset_Owners, Dev_Team, Print_Ops)
#
# PE-002  SeAssignPrimaryTokenPrivilege  -> svc_jabba
# PE-003  SeTcbPrivilege                -> svc_tcb
# PE-004  SeLoadDriverPrivilege         -> Dev_Team group + RTCore64 placeholder
# PE-021  SeIncreaseQuotaPrivilege      -> svc_quota
# PE-026  SeManageVolumePrivilege       -> Asset_Owners group
# PE-027  SeCreateSymbolicLinkPrivilege -> Dev_Team group
# PE-028  SeDebugPrivilege (Admins)     -> verify + NoLmHash=0
# PE-029  SeTakeOwnershipPrivilege      -> Asset_Owners group
# PE-058  Print Operators              -> Print_Ops group / print_user member
# ==============================================================================

# ──────────────────────────────────────────────────────────────────────────────
# Helper: Grant a User Rights Assignment via secedit for a single account/group.
# Used by PE-002, PE-003, PE-021 (all run on scarif which is the member server
# where these service accounts must hold privileges locally).
# ──────────────────────────────────────────────────────────────────────────────

# ------------------------------------------------------------------------------
# PE-002: SeAssignPrimaryTokenPrivilege — svc_jabba service account
# Allows the account to replace the default process token, enabling token
# swapping without SeImpersonate. Interesting for token-manipulation chains.
# ------------------------------------------------------------------------------
- name: PE-002 - Ensure svc_jabba AD account exists
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    if (-not (Get-ADUser -Filter "SamAccountName -eq 'svc_jabba'" -ErrorAction SilentlyContinue)) {
      New-ADUser -Name "svc_jabba" -SamAccountName "svc_jabba" `
        -AccountPassword (ConvertTo-SecureString "{{ svc_jabba_password }}" -AsPlainText -Force) `
        -Enabled $true -PasswordNeverExpires $true `
        -Path "CN=Users,DC=empire,DC=local" -ErrorAction SilentlyContinue
      Write-Output "changed: svc_jabba created"
    } else {
      Write-Output "ok: svc_jabba exists"
    }
  delegate_to: coruscant.empire.local
  run_once: true
  register: result_svc_jabba_create
  changed_when: "'changed:' in result_svc_jabba_create.stdout"
  failed_when: result_svc_jabba_create.rc != 0
  when: inventory_hostname == 'scarif.empire.local'

- name: PE-002 - Grant SeAssignPrimaryTokenPrivilege to svc_jabba via secedit
  ansible.windows.win_shell: |
    $tmp = "$env:TEMP\pe002_priv.inf"
    secedit /export /cfg $tmp /areas USER_RIGHTS | Out-Null
    try {
      $sid = (New-Object System.Security.Principal.NTAccount(
                "{{ ad_domain_netbios }}", "svc_jabba"
              )).Translate([System.Security.Principal.SecurityIdentifier]).Value
      $content = Get-Content $tmp
      $line    = "SeAssignPrimaryTokenPrivilege = *$sid"
      if ($content -match "^\s*SeAssignPrimaryTokenPrivilege\s*=") {
        $content = $content -replace "^\s*SeAssignPrimaryTokenPrivilege\s*=.*", $line
      } else {
        $content += $line
      }
      Set-Content -Path $tmp -Value $content
      secedit /configure /db secedit.sdb /cfg $tmp /areas USER_RIGHTS | Out-Null
      Write-Output "changed: SeAssignPrimaryTokenPrivilege granted to svc_jabba"
    } catch {
      Write-Host "PE-002 secedit error: $($_.Exception.Message)"
    }
  when: inventory_hostname == 'scarif.empire.local'
  register: result_pe002
  changed_when: "'changed:' in result_pe002.stdout"
  failed_when: result_pe002.rc != 0

- name: PE-002 - Verify SeAssignPrimaryTokenPrivilege assigned to svc_jabba
  ansible.windows.win_shell: |
    $tmp = "$env:TEMP\pe002_check.inf"
    secedit /export /cfg $tmp /areas USER_RIGHTS | Out-Null
    $content = Get-Content $tmp | Where-Object { $_ -match "SeAssignPrimaryTokenPrivilege" }
    Write-Output $content
  when: inventory_hostname == 'scarif.empire.local'
  register: result_pe002_check
  changed_when: false
  failed_when: result_pe002_check.rc != 0

# ------------------------------------------------------------------------------
# PE-003: SeTcbPrivilege — svc_tcb ("act as part of the operating system")
# This is one of the most powerful token privileges; rarely granted outside
# SYSTEM. Having it lets an account generate arbitrary logon tokens.
# ------------------------------------------------------------------------------
- name: PE-003 - Ensure svc_tcb AD account exists
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    if (-not (Get-ADUser -Filter "SamAccountName -eq 'svc_tcb'" -ErrorAction SilentlyContinue)) {
      New-ADUser -Name "svc_tcb" -SamAccountName "svc_tcb" `
        -AccountPassword (ConvertTo-SecureString "{{ svc_tcb_password }}" -AsPlainText -Force) `
        -Enabled $true -PasswordNeverExpires $true `
        -Path "CN=Users,DC=empire,DC=local" -ErrorAction SilentlyContinue
      Write-Output "changed: svc_tcb created"
    } else {
      Write-Output "ok: svc_tcb exists"
    }
  delegate_to: coruscant.empire.local
  run_once: true
  register: result_svc_tcb_create
  changed_when: "'changed:' in result_svc_tcb_create.stdout"
  failed_when: result_svc_tcb_create.rc != 0
  when: inventory_hostname == 'scarif.empire.local'

- name: PE-003 - Grant SeTcbPrivilege to svc_tcb via secedit
  ansible.windows.win_shell: |
    $tmp = "$env:TEMP\pe003_priv.inf"
    secedit /export /cfg $tmp /areas USER_RIGHTS | Out-Null
    try {
      $sid = (New-Object System.Security.Principal.NTAccount(
                "{{ ad_domain_netbios }}", "svc_tcb"
              )).Translate([System.Security.Principal.SecurityIdentifier]).Value
      $content = Get-Content $tmp
      $line    = "SeTcbPrivilege = *$sid"
      if ($content -match "^\s*SeTcbPrivilege\s*=") {
        $content = $content -replace "^\s*SeTcbPrivilege\s*=.*", $line
      } else {
        $content += $line
      }
      Set-Content -Path $tmp -Value $content
      secedit /configure /db secedit.sdb /cfg $tmp /areas USER_RIGHTS | Out-Null
      Write-Output "changed: SeTcbPrivilege granted to svc_tcb"
    } catch {
      Write-Host "PE-003 secedit error: $($_.Exception.Message)"
    }
  when: inventory_hostname == 'scarif.empire.local'
  register: result_pe003
  changed_when: "'changed:' in result_pe003.stdout"
  failed_when: result_pe003.rc != 0

- name: PE-003 - Verify SeTcbPrivilege assigned
  ansible.windows.win_shell: |
    $tmp = "$env:TEMP\pe003_check.inf"
    secedit /export /cfg $tmp /areas USER_RIGHTS | Out-Null
    Get-Content $tmp | Where-Object { $_ -match "SeTcbPrivilege" } | Write-Output
  when: inventory_hostname == 'scarif.empire.local'
  register: result_pe003_check
  changed_when: false
  failed_when: result_pe003_check.rc != 0

# ------------------------------------------------------------------------------
# PE-004: SeLoadDriverPrivilege — Dev_Team local group
# Allows members to install/unload kernel drivers. Combined with RTCore64.sys
# this gives arbitrary kernel R/W. Group is also used by PE-027.
# ------------------------------------------------------------------------------
- name: PE-004 - Ensure Dev_Team local group exists on scarif
  ansible.windows.win_shell: |
    $g = Get-LocalGroup -Name "Dev_Team" -ErrorAction SilentlyContinue
    if (-not $g) {
      New-LocalGroup -Name "Dev_Team" -Description "EMPIRE Sales (PE-004/027)" | Out-Null
      Write-Output "changed: Dev_Team created"
    } else {
      Write-Output "ok: Dev_Team exists"
    }
  when: inventory_hostname == 'scarif.empire.local'
  register: result_devteam_group
  changed_when: "'changed:' in result_devteam_group.stdout"
  failed_when: result_devteam_group.rc != 0

- name: PE-004 - Grant SeLoadDriverPrivilege to Dev_Team via secedit
  ansible.windows.win_shell: |
    $tmp = "$env:TEMP\pe004_priv.inf"
    secedit /export /cfg $tmp /areas USER_RIGHTS | Out-Null
    # Use the local group SID (S-1-5-32-* or a local SID — resolve dynamically)
    try {
      $sid = (New-Object System.Security.Principal.NTAccount(
                $env:COMPUTERNAME, "Dev_Team"
              )).Translate([System.Security.Principal.SecurityIdentifier]).Value
      $content = Get-Content $tmp
      $line    = "SeLoadDriverPrivilege = *$sid"
      if ($content -match "^\s*SeLoadDriverPrivilege\s*=") {
        $content = $content -replace "^\s*SeLoadDriverPrivilege\s*=.*", $line
      } else {
        $content += $line
      }
      Set-Content -Path $tmp -Value $content
      secedit /configure /db secedit.sdb /cfg $tmp /areas USER_RIGHTS | Out-Null
      Write-Output "changed: SeLoadDriverPrivilege granted to Dev_Team"
    } catch {
      Write-Host "PE-004 secedit error: $($_.Exception.Message)"
    }
  when: inventory_hostname == 'scarif.empire.local'
  register: result_pe004
  changed_when: "'changed:' in result_pe004.stdout"
  failed_when: result_pe004.rc != 0

- name: PE-004 - Stage RTCore64.sys placeholder at C:\Tools\RTCore64.sys
  ansible.windows.win_copy:
    dest: 'C:\Tools\RTCore64.sys'
    content: "EMPIRE_PLACEHOLDER: place real RTCore64.sys here for BYOVD chain\r\n"
  when: inventory_hostname == 'scarif.empire.local'

- name: PE-004 - Stage drivers README at C:\Tools\drivers\README.txt
  ansible.windows.win_file:
    path: 'C:\Tools\drivers'
    state: directory
  when: inventory_hostname == 'scarif.empire.local'

- name: PE-004/049 - Drop driver README explaining download requirement
  ansible.windows.win_copy:
    dest: 'C:\Tools\drivers\README.txt'
    content: |
      EMPIRE Vulnerable Driver Drop Zone (PE-004 / PE-049)
      =====================================================
      Place RTCore64.sys (MSI Afterburner <=4.6.4 or RTSS) here.
      Obtain from: https://github.com/TheCruZ/kdmapper (bundled)
      Or: https://www.guru3d.com/files-details/msi-afterburner-download.html

      Attack chain:
        1. Authenticate as a Dev_Team member (SeLoadDriverPrivilege)
        2. sc.exe create RTCore64 binpath= C:\Tools\RTCore64.sys type= kernel
        3. Use kdmapper or direct IOCTL to obtain kernel R/W primitive
        4. Overwrite SYSTEM token ACL or disable PatchGuard callback

      Hash (expected):  SHA256 of legitimate RTCore64.sys varies by version.
      SeLoadDriverPrivilege holders: Dev_Team local group on this host.
  when: inventory_hostname == 'scarif.empire.local'

- name: PE-004 - Verify SeLoadDriverPrivilege and RTCore64 placeholder
  ansible.windows.win_shell: |
    $privOk  = $false
    $fileOk  = Test-Path "C:\Tools\RTCore64.sys"
    $tmp     = "$env:TEMP\pe004_check.inf"
    secedit /export /cfg $tmp /areas USER_RIGHTS | Out-Null
    $privLine = Get-Content $tmp | Where-Object { $_ -match "SeLoadDriverPrivilege" }
    if ($privLine) { $privOk = $true }
    Write-Output "SeLoadDriverPrivilege line: $privLine"
    Write-Output "RTCore64.sys present: $fileOk"
    if (-not $privOk -or -not $fileOk) { exit 1 }
  when: inventory_hostname == 'scarif.empire.local'
  register: result_pe004_check
  changed_when: false
  failed_when: result_pe004_check.rc != 0

