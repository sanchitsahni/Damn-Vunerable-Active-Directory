# ------------------------------------------------------------------------------
# PE-020: SeChangeNotifyPrivilege traverse — hidden dir + restricted ACL.
# C:\ProgramData\DunderHidden\ has a restrictive ACL that blocks LIST/READ but
# does NOT deny traverse (SeChangeNotify is held by all users by default),
# so an attacker who knows the exact flag path can read it without being able
# to enumerate the parent directory.
# ------------------------------------------------------------------------------
- name: PE-020 - Create C:\ProgramData\DunderHidden traversal directory
  ansible.windows.win_file:
    path: 'C:\ProgramData\DunderHidden'
    state: directory
  when: inventory_hostname == 'scarif.empire.local'

- name: PE-020 - Drop flag inside DunderHidden (direct-path read via SeChangeNotify)
  ansible.windows.win_copy:
    dest: 'C:\ProgramData\DunderHidden\flag.txt'
    content: "EMPIRE{PE-020_SECHANGENOTIFY_TRAVERSE_BYPASS}\r\nI am ready to face any challenges that might be foolish enough to face me. — Darth Maul\r\n"
  when: inventory_hostname == 'scarif.empire.local'

- name: PE-020 - Restrict DunderHidden ACL (block list, allow traverse)
  ansible.windows.win_shell: |
    $path = "C:\ProgramData\DunderHidden"
    # Remove inherited ACEs and replace with admin/SYSTEM full + Users traverse only
    icacls $path /inheritance:r 2>$null | Out-Null
    icacls $path /grant "NT AUTHORITY\SYSTEM:(OI)(CI)F" 2>$null | Out-Null
    icacls $path /grant "BUILTIN\Administrators:(OI)(CI)F" 2>$null | Out-Null
    # No explicit Users grant on the directory itself; traverse is allowed via
    # SeChangeNotify (cannot be denied without explicitly adding a Deny ACE).
    # The flag file gets SYSTEM-only ACL so only direct-path access works.
    icacls "$path\flag.txt" /inheritance:r 2>$null | Out-Null
    icacls "$path\flag.txt" /grant "NT AUTHORITY\SYSTEM:F" 2>$null | Out-Null
    icacls "$path\flag.txt" /grant "BUILTIN\Administrators:F" 2>$null | Out-Null
  when: inventory_hostname == 'scarif.empire.local'
  changed_when: false

- name: PE-020 - Verify DunderHidden directory exists
  ansible.windows.win_stat:
    path: 'C:\ProgramData\DunderHidden'
  register: result_pe020_check
  changed_when: false
  failed_when: not result_pe020_check.stat.exists
  when: inventory_hostname == 'scarif.empire.local'
