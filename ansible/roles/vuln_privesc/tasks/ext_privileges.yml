# ------------------------------------------------------------------------------
# PE-028: SeDebugPrivilege — local Administrators (already standard).
# We also set NoLmHash=0 to re-enable LM credential material storage so that
# participants can demonstrate the full credential-dumping chain.
# ------------------------------------------------------------------------------
- name: PE-028 - Verify SeDebugPrivilege is in Administrators grant (secedit check)
  ansible.windows.win_shell: |
    $tmp = "$env:TEMP\pe028_check.inf"
    secedit /export /cfg $tmp /areas USER_RIGHTS | Out-Null
    $line = Get-Content $tmp | Where-Object { $_ -match "SeDebugPrivilege" }
    if ($line) {
      Write-Output "ok: SeDebugPrivilege line: $line"
    } else {
      # Not explicitly set means it defaults to Administrators via built-in policy.
      # Explicitly set it to be sure.
      $content = Get-Content $tmp
      $content += "SeDebugPrivilege = *S-1-5-32-544"
      Set-Content -Path $tmp -Value $content
      secedit /configure /db secedit.sdb /cfg $tmp /areas USER_RIGHTS | Out-Null
      Write-Output "changed: SeDebugPrivilege explicitly granted to Administrators"
    }
  when: inventory_hostname in ['scarif.empire.local', 'tatooine.empire.local']
  register: result_pe028_priv
  changed_when: "'changed:' in result_pe028_priv.stdout"
  failed_when: result_pe028_priv.rc != 0

- name: PE-028 - Set NoLmHash=0 to enable LM credential storage
  ansible.windows.win_regedit:
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    name: NoLmHash
    data: 0
    type: dword
  when: inventory_hostname in ['scarif.empire.local', 'tatooine.empire.local']

- name: PE-028 - Verify NoLmHash registry value
  ansible.windows.win_reg_stat:
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
    name: NoLmHash
  register: result_pe028_reg
  changed_when: false
  when: inventory_hostname in ['scarif.empire.local', 'tatooine.empire.local']

