---
# ==============================================================================
# vuln_privesc/tasks/registry.yml
# Targets: ws01.corp.local (PE-011, PE-012), file01.corp.local (PE-011)
#          ws01.corp.local (PE-024 HiveNightmare ACL)
#
# PE-011  AlwaysInstallElevated in HKLM + HKCU (MSI payload escalation)
# PE-012  ConsentPromptBehaviorAdmin=0 (UAC auto-elevate bypass surface)
# PE-024  BUILTIN\Users can read SAM/SYSTEM/SECURITY hive files (HiveNightmare)
# ==============================================================================

# ------------------------------------------------------------------------------
# PE-011: AlwaysInstallElevated — both hives must be set for MSI escalation.
# Applies to ws01 and file01.
# ------------------------------------------------------------------------------
- name: PE-011 - AlwaysInstallElevated HKLM
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    name: AlwaysInstallElevated
    data: 1
    type: dword
  when: inventory_hostname in ['ws01.corp.local', 'file01.corp.local']

- name: PE-011 - AlwaysInstallElevated HKCU
  ansible.windows.win_regedit:
    path: 'HKCU:\SOFTWARE\Policies\Microsoft\Windows\Installer'
    name: AlwaysInstallElevated
    data: 1
    type: dword
  when: inventory_hostname in ['ws01.corp.local', 'file01.corp.local']

# ------------------------------------------------------------------------------
# PE-012: Auto-elevate UAC (ConsentPromptBehaviorAdmin=0) on ws01.
# EnableLUA stays on so FodHelper/sdclt/WSReset bypass techniques remain
# in scope; we just remove the consent dialog for medium-IL admins.
# ------------------------------------------------------------------------------
- name: PE-012 - Set ConsentPromptBehaviorAdmin=0 (no UAC prompt for admins)
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    name: ConsentPromptBehaviorAdmin
    data: 0
    type: dword
  when: inventory_hostname == 'ws01.corp.local'

# ------------------------------------------------------------------------------
# PE-024: HiveNightmare / SeriousSAM — grant BUILTIN\Users read on hive files
# Simulates the CVE-2021-36934 DACL misconfiguration: the hive files become
# readable by unprivileged users, exposing local account NTLM hashes.
# ------------------------------------------------------------------------------
- name: PE-024 - Grant BUILTIN\Users read on SAM/SYSTEM/SECURITY hive files
  ansible.windows.win_shell: |
    foreach ($h in @('SAM', 'SYSTEM', 'SECURITY')) {
      $path = "$env:windir\System32\config\$h"
      if (Test-Path $path) {
        icacls $path /grant "BUILTIN\Users:(R)" 2>$null | Out-Null
      }
    }
  when: inventory_hostname == 'ws01.corp.local'
  changed_when: false
