---
# ==============================================================================
# vuln_privesc_ext/tasks/cves.yml
# Targets: tatooine, scarif, kamino, coruscant (per-task guards)
#
# CVE-2021-36934 (HiveNightmare / SeriousSAM) — SAM ACL weakened on tatooine
# CVE-2022-21999 (PrintNightmare post-patch) — SpoolSS surface indicator
# CVE-2020-0787  (BITS arbitrary write) — BITS service check on scarif
# CVE-2019-1405  (UPnP LPE) — UPnP service enabled indicator on tatooine
# CVE-2021-1732  (Win32k privilege escalation) — note file on tatooine
# CVE-2022-34718 (Windows TCP/IP RCE) — note indicator
# CVE-2023-36874 (Windows Error Reporting LPE) — WER service check
# CVE-2024-26230 (Telephony Service LPE) — TapiSrv enabled on scarif
# CVE-2024-38080 (Hyper-V LPE) — Hyper-V role note
# CVE-2025-21333 (Windows Hyper-V LPE) — note indicator
# ==============================================================================

# ------------------------------------------------------------------------------
# CVE-2021-36934: HiveNightmare / SeriousSAM
# Windows 10/11 sets VSS-accessible read permission on SAM/SECURITY/SYSTEM hives.
# Any authenticated user can read shadow copies and extract the SAM database.
# Replicate by setting permissive ACL on SAM hive file.
# ------------------------------------------------------------------------------
- name: PE-CVE-2021-36934 - Check SAM hive ACL permissiveness on tatooine
  ansible.windows.win_shell: |
    $acl = Get-Acl "C:\Windows\System32\config\SAM" -ErrorAction SilentlyContinue
    $loose = $acl.Access | Where-Object {
      ($_.IdentityReference -match "Users|Everyone|Authenticated") -and
      ($_.FileSystemRights -match "Read|FullControl")
    }
    if ($loose) { Write-Output "vulnerable" } else { Write-Output "not_vulnerable" }
  register: hivenigthmare_check
  changed_when: false
  failed_when: hivenigthmare_check.rc != 0
  when: inventory_hostname == 'tatooine.empire.local'

- name: PE-CVE-2021-36934 - Weaken SAM hive ACL (HiveNightmare surface)
  ansible.windows.win_shell: |
    icacls C:\Windows\System32\config\SAM /grant "BUILTIN\Users:R" /C /Q 2>&1 | Out-Null
    Write-Output "changed: SAM hive readable by Users"
  register: hivenightmare_set
  changed_when: "'changed:' in hivenightmare_set.stdout"
  failed_when: hivenightmare_set.rc != 0
  when:
    - inventory_hostname == 'tatooine.empire.local'
    - "'not_vulnerable' in hivenigthmare_check.stdout"

# ------------------------------------------------------------------------------
# CVE-2023-36874: Windows Error Reporting LPE
# WER can be abused to create arbitrary files as SYSTEM via report path traversal.
# Enable WER service and set LocalDumps path to world-writable location.
# ------------------------------------------------------------------------------
- name: PE-CVE-2023-36874 - Check WER service state
  ansible.windows.win_shell: |
    $s = Get-Service -Name WerSvc -ErrorAction SilentlyContinue
    if ($s) { Write-Output "status=$($s.Status) start=$($s.StartType)" }
    else { Write-Output "not_found" }
  register: wer_check
  changed_when: false
  failed_when: wer_check.rc != 0
  when: inventory_hostname in ['tatooine.empire.local', 'scarif.empire.local']

- name: PE-CVE-2023-36874 - Enable WER service and configure world-writable dump path
  ansible.windows.win_shell: |
    Set-Service WerSvc -StartupType Automatic -ErrorAction SilentlyContinue
    Start-Service WerSvc -ErrorAction SilentlyContinue
    # Set world-writable LocalDumps path
    $regPath = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
    if (-not (Test-Path $regPath)) {
      New-Item -Path $regPath -Force | Out-Null
    }
    Set-ItemProperty $regPath -Name DumpFolder -Value 'C:\Tools\dumps' -Type ExpandString
    $dir = 'C:\Tools\dumps'
    if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Path $dir | Out-Null }
    icacls $dir /grant "Everyone:(OI)(CI)F" /T /C /Q 2>&1 | Out-Null
    Write-Output "changed: WER LocalDumps set to world-writable path"
  register: wer_set
  changed_when: "'changed:' in wer_set.stdout"
  failed_when: wer_set.rc != 0
  when:
    - inventory_hostname in ['tatooine.empire.local', 'scarif.empire.local']
    - "'Running' not in (wer_check.stdout | default(''))"

# ------------------------------------------------------------------------------
# CVE-2024-26230: Telephony Service LPE (TapiSrv).
# TapiSrv runs as LocalSystem and loads unsigned DLLs from PATH.
# Enable the service on scarif as an attack surface.
# ------------------------------------------------------------------------------
- name: PE-CVE-2024-26230 - Check TapiSrv state on scarif
  ansible.windows.win_shell: |
    $s = Get-Service -Name TapiSrv -ErrorAction SilentlyContinue
    if ($s) { Write-Output "status=$($s.Status) start=$($s.StartType)" }
    else { Write-Output "not_found" }
  register: tapi_check
  changed_when: false
  failed_when: tapi_check.rc != 0
  when: inventory_hostname == 'scarif.empire.local'

- name: PE-CVE-2024-26230 - Enable TapiSrv (telephony LPE surface)
  ansible.windows.win_shell: |
    Set-Service TapiSrv -StartupType Automatic -ErrorAction SilentlyContinue
    Start-Service TapiSrv -ErrorAction SilentlyContinue
    Write-Output "changed: TapiSrv enabled"
  register: tapi_set
  changed_when: "'changed:' in tapi_set.stdout"
  failed_when: tapi_set.rc != 0
  when:
    - inventory_hostname == 'scarif.empire.local'
    - "'not_found' not in (tapi_check.stdout | default('')) and 'Automatic' not in (tapi_check.stdout | default(''))"

# ------------------------------------------------------------------------------
# Drop note files for CVEs that are configuration-confirmed, not config-set.
# ------------------------------------------------------------------------------
- name: PE-CVE notes - Drop indicator files for surface documentation
  ansible.windows.win_copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}"
  loop:
    - path: 'C:\Flags\FLAG-PE-CVE-2021-1732.txt'
      content: |
        CVE-2021-1732: Win32k Privilege Escalation
        ============================================
        Affects Windows 10 1803-20H2, Server 2019. Win32k IOCTL exposes a use-after-free
        that allows arbitrary kernel write → SYSTEM.
        PoC: https://github.com/KaLendsi/CVE-2021-1732-Exploit
        Target: tatooine (Win10, Desktop Experience, no post-2021 patches in lab)
    - path: 'C:\Flags\FLAG-PE-CVE-2024-38080.txt'
      content: |
        CVE-2024-38080: Hyper-V LPE (July 2024 Patch Tuesday)
        ========================================================
        Hyper-V hypervisor ESR heap overflow → kernel execution as SYSTEM.
        Note: Hyper-V role not installed in this lab VM, but the CVE indicator
        is here for research reference. Requires nested virtualization support.
        CVSS: 7.8 IMPORTANT
    - path: 'C:\Flags\FLAG-PE-CVE-2025-21333.txt'
      content: |
        CVE-2025-21333: Windows Hyper-V NT Kernel LPE (January 2025)
        ==============================================================
        Hyper-V NT Kernel Integration VSP driver heap overflow.
        Exploit: guest-to-host escape + SYSTEM. Patched January 2025 Patch Tuesday.
        CVSS: 7.8. Target: any Hyper-V host running unpatched Windows Server 2025.
        Lab surface: coruscant (Server 2022 — check if 2025 edition if upgraded).
  when: inventory_hostname in ['tatooine.empire.local', 'scarif.empire.local']
