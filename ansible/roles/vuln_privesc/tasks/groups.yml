---
# ==============================================================================
# vuln_privesc/tasks/groups.yml  —  coruscant.empire.local
# BATCHED: one templated run instead of ~8 WinRM round-trips.
# Logic in templates/groups.ps1.j2 (PE-005/006/059, PE-057, PE-018, PE-019).
# ==============================================================================

- name: PE-groups - Ensure DunderLab dir exists
  ansible.windows.win_file:
    path: C:\DunderLab
    state: directory
  when: inventory_hostname == 'coruscant.empire.local'

- name: PE-groups - Render batched group-PE script
  ansible.windows.win_template:
    src: groups.ps1.j2
    dest: C:\DunderLab\groups_pe.ps1
  when: inventory_hostname == 'coruscant.empire.local'

- name: PE-groups - Run batched group-PE script (PE-005/057/018/019)
  ansible.windows.win_shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\DunderLab\groups_pe.ps1
  register: pe_groups_run
  changed_when: "'CHANGED:' in pe_groups_run.stdout"
  failed_when: "'DONE' not in pe_groups_run.stdout"
  when: inventory_hostname == 'coruscant.empire.local'
