---
# ==============================================================================
# vuln_privesc/tasks/main.yml
#
# Sub-tasks are imported unconditionally; each file uses
# `when: inventory_hostname ==` guards for host-specific steps.
#
# Host → sub-tasks applicable:
#   coruscant.empire.local    -> groups.yml (operator groups), registry.yml (none)
#   scarif.empire.local  -> services.yml, tokens.yml, registry.yml
#   kamino.empire.local   -> tokens.yml
#   tatooine.empire.local    -> registry.yml, services.yml (minimal)
# ==============================================================================

- name: Import services tasks
  ansible.builtin.import_tasks: services.yml

- name: Import token/privilege tasks
  ansible.builtin.import_tasks: tokens.yml

- name: Import group membership tasks
  ansible.builtin.import_tasks: groups.yml

- name: Import registry tasks
  ansible.builtin.import_tasks: registry.yml

# Extended privesc surfaces (absorbed from vuln_privesc_ext + vuln_pe_extended)

- name: Import extended service privesc surfaces
  ansible.builtin.import_tasks: ext_services.yml

- name: Import extended CVE privesc surfaces (tatooine + scarif)
  ansible.builtin.import_tasks: ext_cves.yml
  when: inventory_hostname in ['tatooine.empire.local', 'scarif.empire.local']

- name: Import kernel/BYOVD privesc surfaces
  ansible.builtin.import_tasks: kernel.yml

- name: Import extended privilege escalation token/right surfaces
  ansible.builtin.import_tasks: ext_privileges.yml

- name: Import DLL hijack / PATH hijack privesc surfaces (scarif + tatooine)
  ansible.builtin.import_tasks: ext_paths_dlls.yml
  when: inventory_hostname in ['scarif.empire.local', 'tatooine.empire.local']

- name: Import PE extended registry surfaces
  ansible.builtin.import_tasks: registry_pe.yml

- name: Import AD privilege escalation surfaces (coruscant)
  ansible.builtin.import_tasks: ad_pe.yml
  when: inventory_hostname == 'coruscant.empire.local'
