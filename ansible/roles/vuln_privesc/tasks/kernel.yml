---
# ==============================================================================
# vuln_privesc/tasks/kernel.yml  —  all Windows hosts
# BATCHED: one templated run instead of 3 win_copy calls. Drops the kernel/BYOVD
# technique-reference notes (PE-101/110/115). Logic in templates/kernel.ps1.j2.
# ==============================================================================

- name: PE-kernel - Ensure DunderLab dir exists
  ansible.windows.win_file:
    path: C:\DunderLab
    state: directory

- name: PE-kernel - Render batched kernel-PE notes script
  ansible.windows.win_template:
    src: kernel.ps1.j2
    dest: C:\DunderLab\kernel.ps1

- name: PE-kernel - Run batched kernel-PE notes script (PE-101/110/115)
  ansible.windows.win_shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\DunderLab\kernel.ps1
  register: pe_kernel_run
  changed_when: "'CHANGED:' in pe_kernel_run.stdout"
  failed_when: "'DONE' not in pe_kernel_run.stdout"
