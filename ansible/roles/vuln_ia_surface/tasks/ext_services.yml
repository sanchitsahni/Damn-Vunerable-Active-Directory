---
# ==============================================================================
# vuln_ia_surface/tasks/ext_services.yml  —  scarif.empire.local
# BATCHED: one templated PowerShell run instead of ~8 WinRM round-trips.
# Logic in templates/ext_services.ps1.j2 (IA-076 IIS dir-browse, IA-078 WebDAV,
# IA-084 RDP NLA off, IA-085 OpenSSH). All work targets scarif; coruscant (in the
# import guard) intentionally gets nothing here.
# ==============================================================================

- name: IA-services - Ensure DunderLab dir exists
  ansible.windows.win_file:
    path: C:\DunderLab
    state: directory
  when: inventory_hostname == 'scarif.empire.local'

- name: IA-services - Render batched service-surface script
  ansible.windows.win_template:
    src: ext_services.ps1.j2
    dest: C:\DunderLab\ext_services.ps1
  when: inventory_hostname == 'scarif.empire.local'

- name: IA-services - Run batched service-surface script (IA-076/078/084/085)
  ansible.windows.win_shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\DunderLab\ext_services.ps1
  register: ia_services_run
  changed_when: "'CHANGED:' in ia_services_run.stdout"
  failed_when: "'ERROR:' in ia_services_run.stdout"
  when: inventory_hostname == 'scarif.empire.local'
