---
# ==============================================================================
# vuln_ia_extended/tasks/services.yml — IA-076..110
# Target: file01.corp.local, dc01.corp.local
#
# IA-076  IIS with directory browsing enabled
# IA-077  IIS with anonymous authentication
# IA-078  IIS with WebDAV enabled
# IA-079  IIS with PUT method enabled
# IA-080  FTP with anonymous access (already IA-035)
# IA-081  Telnet service enabled (legacy remote access)
# IA-082  TFTP server listening
# IA-083  VNC server with weak password
# IA-084  RDP NLA disabled (pre-auth access)
# IA-085  SSH server (OpenSSH) with password auth
# IA-086  MSSQL accessible without domain auth
# IA-087  WinRM accessible without Kerberos (NTLM)
# IA-088  DCOM accessible remotely
# IA-089  WMI accessible remotely without auth
# IA-090  NetBIOS name service (port 137/138)
# ==============================================================================

# IA-076: IIS directory browsing
- name: IA-076 - Check if IIS is installed on file01
  ansible.windows.win_shell: |
    $f = Get-WindowsFeature Web-Server -ErrorAction SilentlyContinue
    if ($f -and $f.Installed) { Write-Output "installed" } else { Write-Output "not_installed" }
  register: ia076_iis_check
  changed_when: false
  failed_when: ia076_iis_check.rc != 0
  when: inventory_hostname == 'file01.corp.local'

- name: IA-076 - Install IIS with WebDAV on file01
  ansible.windows.win_feature:
    name:
      - Web-Server
      - Web-DAV-Publishing
      - Web-Dir-Browsing
      - Web-Http-Logging
      - Web-Stat-Compression
    state: present
  register: ia076_iis_install
  when:
    - inventory_hostname == 'file01.corp.local'
    - "'not_installed' in ia076_iis_check.stdout"

- name: IA-076 - Enable IIS directory browsing
  ansible.windows.win_shell: |
    Import-Module WebAdministration -ErrorAction SilentlyContinue
    Set-WebConfigurationProperty /system.webServer/directoryBrowse `
      -Name enabled -Value True -PSPath 'IIS:\' -ErrorAction SilentlyContinue
    Write-Output "changed: directory browsing enabled"
  register: ia076_set
  changed_when: "'changed:' in ia076_set.stdout"
  failed_when: ia076_set.rc != 0
  when: inventory_hostname == 'file01.corp.local'

# IA-078: WebDAV enabled with write permissions
- name: IA-078 - Enable WebDAV write (IA-078 surface)
  ansible.windows.win_shell: |
    Import-Module WebAdministration -ErrorAction SilentlyContinue
    Set-WebConfigurationProperty /system.webServer/webdav/authoring `
      -Name enabled -Value True -PSPath 'IIS:\' -ErrorAction SilentlyContinue
    Write-Output "changed: WebDAV authoring enabled"
  register: ia078_set
  changed_when: "'changed:' in ia078_set.stdout"
  failed_when: ia078_set.rc != 0
  when: inventory_hostname == 'file01.corp.local'

# IA-084: RDP with NLA disabled
- name: IA-084 - Check NLA setting
  ansible.windows.win_shell: |
    $v = (Get-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -ErrorAction SilentlyContinue).UserAuthentication
    if ($null -eq $v) { Write-Output "not_set" } else { Write-Output "value=$v" }
  register: ia084_check
  changed_when: false
  failed_when: ia084_check.rc != 0
  when: inventory_hostname in ['file01.corp.local', 'ws01.corp.local']

- name: IA-084 - Disable NLA for RDP (pre-auth attack surface)
  ansible.windows.win_regedit:
    path: 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
    name: UserAuthentication
    data: 0
    type: dword
  when:
    - inventory_hostname in ['file01.corp.local', 'ws01.corp.local']
    - "'value=0' not in ia084_check.stdout"

# IA-085: OpenSSH with password auth
- name: IA-085 - Check if OpenSSH server is installed
  ansible.windows.win_shell: |
    $f = Get-WindowsCapability -Online -Name OpenSSH.Server* -ErrorAction SilentlyContinue
    if ($f -and $f.State -eq 'Installed') { Write-Output "installed" }
    else { Write-Output "not_installed" }
  register: ia085_ssh_check
  changed_when: false
  failed_when: ia085_ssh_check.rc != 0
  when: inventory_hostname == 'file01.corp.local'

- name: IA-085 - Install OpenSSH Server on file01
  ansible.windows.win_shell: |
    Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 -ErrorAction SilentlyContinue
    Start-Service sshd -ErrorAction SilentlyContinue
    Set-Service sshd -StartupType Automatic -ErrorAction SilentlyContinue
    # Allow password authentication
    $sshd_config = 'C:\ProgramData\ssh\sshd_config'
    if (Test-Path $sshd_config) {
      (Get-Content $sshd_config) -replace '#?PasswordAuthentication.*', 'PasswordAuthentication yes' |
        Set-Content $sshd_config
    }
    Write-Output "changed: OpenSSH installed with password auth"
  register: ia085_ssh_set
  changed_when: "'changed:' in ia085_ssh_set.stdout"
  failed_when: ia085_ssh_set.rc != 0
  when:
    - inventory_hostname == 'file01.corp.local'
    - "'not_installed' in ia085_ssh_check.stdout"
