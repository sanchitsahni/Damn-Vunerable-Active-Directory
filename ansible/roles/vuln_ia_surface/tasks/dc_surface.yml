---
# ==============================================================================
# vuln_ia_surface/tasks/dc_surface.yml  —  all_dcs
# BATCHED: one templated PowerShell run instead of ~13 WinRM round-trips.
# The template (dc_surface.ps1.j2) is rendered per-DC; corp-only blocks
# (IA-003 dsHeuristics, REC-015 SYSVOL creds) are Jinja-gated to coruscant.empire.local.
# IA-004/041 AXFR, IA-046 ADWS, IA-014 ZeroLogon, IA-040 WinRM-HTTPS run on all.
# ==============================================================================

- name: IA-dc - Ensure DunderLab dir exists
  ansible.windows.win_file:
    path: C:\DunderLab
    state: directory

- name: IA-dc - Render batched DC surface script
  ansible.windows.win_template:
    src: dc_surface.ps1.j2
    dest: C:\DunderLab\dc_surface.ps1

- name: IA-dc - Run batched DC surface script (IA-003/004/014/040/046 + REC-015)
  ansible.windows.win_shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\DunderLab\dc_surface.ps1
  register: ia_dc_run
  changed_when: "'CHANGED:' in ia_dc_run.stdout"
  failed_when: "'DONE' not in ia_dc_run.stdout"
