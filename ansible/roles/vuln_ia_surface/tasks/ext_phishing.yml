---
# ==============================================================================
# vuln_ia_extended/tasks/phishing.yml — IA-051..075
# Target: ws01.corp.local
#
# IA-051  HTML phishing page in IIS
# IA-052  Malicious LNK file on Desktop
# IA-053  ISO mounting (AutoPlay enabled)
# IA-054  Macro-enabled Word doc stub
# IA-055  OneNote malicious attachment stub
# IA-056  HTA file in Downloads folder
# IA-057  MHTML file (IE/Edge coercion)
# IA-058  XLL Excel add-in stub
# IA-059  DDE via Excel stub
# IA-060  Phishing via SMB share (auto-mount trigger)
# IA-061  AutoRun USB simulation
# IA-062  ClickOnce delivery stub
# IA-063  Compiled HTML Help (.chm) with ActiveX
# IA-064  Cabinet file (.cab) with embedded EXE
# IA-065  PDF with embedded JavaScript
