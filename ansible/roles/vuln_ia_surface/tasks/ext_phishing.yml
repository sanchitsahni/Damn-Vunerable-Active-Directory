---
# ==============================================================================
# vuln_ia_surface/tasks/ext_phishing.yml  —  tatooine.empire.local
# BATCHED: one templated PowerShell run instead of ~5 WinRM round-trips.
# Logic in templates/ext_phishing.ps1.j2 (IA-052 LNK, IA-053 AutoPlay,
# IA-056 HTA, IA-063 CHM note). The victim-executor (vuln_victim_exec) opens
# these headlessly.
# ==============================================================================

- name: IA-phishing - Ensure DunderLab dir exists
  ansible.windows.win_file:
    path: C:\DunderLab
    state: directory

- name: IA-phishing - Render batched phishing-drop script
  ansible.windows.win_template:
    src: ext_phishing.ps1.j2
    dest: C:\DunderLab\ext_phishing.ps1

- name: IA-phishing - Run batched phishing-drop script (IA-052/053/056/063)
  ansible.windows.win_shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\DunderLab\ext_phishing.ps1
  register: ia_phishing_run
  changed_when: "'CHANGED:' in ia_phishing_run.stdout"
  failed_when: "'ERROR:' in ia_phishing_run.stdout"
