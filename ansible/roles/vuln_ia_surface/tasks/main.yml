---
# ==============================================================================
# vuln_ia_surface/tasks/main.yml
#
# Imports per-host sub-task files guarded by inventory group / hostname.
# Each sub-task file is self-contained with its own check-before-set logic.
#
# Coverage:
#   dc_surface.yml   — all_dcs        : IA-003,004,005,014,040,041,046 + REC-015
#   file01_surface.yml — scarif        : IA-034,035,036,037,038,044,047,050
#   ca01_surface.yml — endor            : IA-039,045,049
#   sql01_surface.yml — kamino          : IA-011,048
#   ws01_surface.yml — tatooine            : IA-019..022,024,027,033,043,045,047
#
# ALL member servers additionally get the WinRM-HTTPS listener (IA-040).
# ==============================================================================

- name: Import DC surface tasks (all domain controllers)
  ansible.builtin.import_tasks: dc_surface.yml
  when: inventory_hostname in groups['all_dcs'] | default([])

- name: Import scarif surface tasks
  ansible.builtin.import_tasks: file01_surface.yml
  when: inventory_hostname == 'scarif.empire.local'

- name: Import endor surface tasks
  ansible.builtin.import_tasks: ca01_surface.yml
  when: inventory_hostname == 'endor.empire.local'

- name: Import kamino surface tasks
  ansible.builtin.import_tasks: sql01_surface.yml
  when: inventory_hostname == 'kamino.empire.local'

- name: Import tatooine surface tasks
  ansible.builtin.import_tasks: ws01_surface.yml
  when: inventory_hostname == 'tatooine.empire.local'

# Extended initial access surfaces (absorbed from vuln_ia_extended)

- name: Import phishing / coercion file surfaces (tatooine)
  ansible.builtin.import_tasks: ext_phishing.yml
  when: inventory_hostname == 'tatooine.empire.local'

- name: Import extended service IA surfaces (scarif + coruscant)
  ansible.builtin.import_tasks: ext_services.yml
  when: inventory_hostname in ['scarif.empire.local', 'coruscant.empire.local']

- name: Import domain misconfiguration IA surfaces (all_dcs)
  ansible.builtin.import_tasks: ext_misconfig.yml
  when: inventory_hostname in groups['all_dcs'] | default([])
