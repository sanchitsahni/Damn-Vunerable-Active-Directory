---
# ==============================================================================
# vuln_ia_surface/tasks/ext_misconfig.yml  —  coruscant.empire.local (domain misconfigs)
# BATCHED: one templated PowerShell run instead of ~8 WinRM round-trips.
# Logic in templates/ext_misconfig.ps1.j2 (IA-113/114/115/117/119).
# ==============================================================================

- name: IA-misconfig - Ensure DunderLab dir exists
  ansible.windows.win_file:
    path: C:\DunderLab
    state: directory
  when: inventory_hostname == 'coruscant.empire.local'

- name: IA-misconfig - Render batched domain-misconfig script
  ansible.windows.win_template:
    src: ext_misconfig.ps1.j2
    dest: C:\DunderLab\ext_misconfig.ps1
  when: inventory_hostname == 'coruscant.empire.local'

- name: IA-misconfig - Run batched domain-misconfig script (IA-113/114/115/117/119)
  ansible.windows.win_shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\DunderLab\ext_misconfig.ps1
  register: ia_misconfig_run
  changed_when: "'CHANGED:' in ia_misconfig_run.stdout"
  failed_when: "'DONE' not in ia_misconfig_run.stdout"
  when: inventory_hostname == 'coruscant.empire.local'
