---
# ==============================================================================
# vuln_ia_surface/tasks/sql01_surface.yml  —  kamino.empire.local
# BATCHED: one templated PowerShell run instead of 6 WinRM round-trips.
# The per-vuln logic (IA-011 sa/xp_cmdshell, IA-048 SQL Browser, IA-040
# WinRM-HTTPS) lives in templates/sql01_surface.ps1.j2, each block self-
# idempotent and emitting CHANGED:/OK:/ERROR: markers.
# ==============================================================================

- name: IA-kamino - Ensure DunderLab dir exists
  ansible.windows.win_file:
    path: C:\DunderLab
    state: directory

- name: IA-kamino - Render batched surface script
  ansible.windows.win_template:
    src: sql01_surface.ps1.j2
    dest: C:\DunderLab\sql01_surface.ps1

- name: IA-kamino - Run batched surface script (sa/xp_cmdshell, SQLBrowser, WinRM-HTTPS)
  ansible.windows.win_shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\DunderLab\sql01_surface.ps1
  register: ia_sql01_run
  changed_when: "'CHANGED:' in ia_sql01_run.stdout"
  failed_when: "'DONE' not in ia_sql01_run.stdout"
