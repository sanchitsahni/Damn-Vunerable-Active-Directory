---
# ==============================================================================
# vuln_cred_extended/tasks/credential_stores.yml — CRED-066..090
# Target: coruscant.empire.local
# ==============================================================================

# Create additional credential accounts
- name: CRED-066..080 - Create service accounts with credential surfaces
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $accounts = @(
      @{ name='svc_devops';     pwd='DevOps2024!';   desc='CRED-066: DevOps pipeline SA' },
      @{ name='svc_monitoring'; pwd='Monitor2024!';  desc='CRED-070: Monitoring SA' },
      @{ name='svc_dbadmin';    pwd='DbAdmin2024!';  desc='CRED-075: DB admin SA' },
      @{ name='svc_jabba2';    pwd='Legacy123';     desc='CRED-080: Weak password legacy SA' },
      @{ name='svc_cicd';       pwd='CiCd2024!';     desc='CRED-081: CI/CD pipeline SA' },
      @{ name='svc_ansible';    pwd='Ansible2024!';  desc='CRED-082: Ansible automation SA' },
      @{ name='svc_terraform';  pwd='Terraform2024!'; desc='CRED-083: Terraform SA' },
      @{ name='svc_grafana';    pwd='Grafana2024!';  desc='CRED-084: Monitoring dashboard SA' }
    )
    foreach ($a in $accounts) {
      $exists = Get-ADUser -Filter "SamAccountName -eq '$($a.name)'" -ErrorAction SilentlyContinue
      if (-not $exists) {
        $p = ConvertTo-SecureString $a.pwd -AsPlainText -Force
        New-ADUser -Name $a.name -SamAccountName $a.name `
          -AccountPassword $p -Enabled $true -PasswordNeverExpires $true `
          -Path "CN=Users,{{ ad_domain_dn }}" `
          -Description $a.desc
        Write-Host "Created: $($a.name)"
      }
    }
    Write-Output "changed: service accounts configured"
  register: cred_accounts_set
  changed_when: "'changed:' in cred_accounts_set.stdout"
  failed_when: cred_accounts_set.rc != 0

# CRED-067: Credentials in Active Directory user description fields
- name: CRED-067 - Set credentials in user description fields
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $u = Get-ADUser -Identity 'svc_jabba2' -ErrorAction SilentlyContinue
    if ($u) {
      Set-ADUser $u -Description "Password: Legacy123 -- DO NOT CHANGE"
    }
    $u2 = Get-ADUser -Identity 'luke.skywalker' -ErrorAction SilentlyContinue
    if ($u2) {
      Set-ADUser $u2 -Description "Temp pwd: SithLord123! -- change at next logon"
    }
    Write-Output "changed: descriptions set with credentials"
  register: cred067_set
  changed_when: "'changed:' in cred067_set.stdout"
  failed_when: cred067_set.rc != 0

# CRED-068: Credentials in LDAP info field
- name: CRED-068 - Set info field with credentials on svc_monitoring
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $u = Get-ADUser -Identity 'svc_monitoring' -Properties info -ErrorAction SilentlyContinue
    if ($u -and -not $u.info) {
      Set-ADUser $u -Replace @{info="Created by IT dept. Default pw: Monitor2024!"}
    }
    Write-Output "changed"
  register: cred068_set
  changed_when: "'changed:' in cred068_set.stdout"
  failed_when: cred068_set.rc != 0

# CRED-070: Credentials in GPO description
- name: CRED-070 - Drop plaintext credential note files
  ansible.windows.win_copy:
    dest: "{{ item.path }}"
    content: "{{ item.content }}"
  loop:
    - path: 'C:\Flags\FLAG-CRED-066-090-CredStores.txt'
      content: |
        CRED-066..090: Credential Store Attack Surfaces
        =================================================
        Service accounts created with credentials in AD:
          svc_devops     — DevOps2024!    (LDAP description)
          svc_monitoring — Monitor2024!   (LDAP info field)
          svc_jabba2    — Legacy123      (CRED-080: weak password, in description)
          luke.skywalker           — SithLord123!   (description field: "Temp pwd")

        Enumeration:
          Get-ADUser -Filter * -Properties Description,info | Where-Object {
            $_.Description -match 'pass|pwd|password' -or
            $_.info -match 'pass|pwd|password'
          }

          ldapsearch -H ldap://10.10.0.10 -x -b "DC=empire,DC=local" \
            "(description=*pass*)" sAMAccountName description

        Also check:
          - GPO registry keys (EMPIRE lab: HKLM\Software\EMPIRELab — IA-119)
          - SYSVOL scripts (setup.bat — REC-015/IA-surface)
          - web.config on IIS (WEB-009 — kamino credentials)

    - path: 'C:\Flags\FLAG-CRED-085-CI-CD-Creds.txt'
      content: |
        CRED-081..085: CI/CD Pipeline Credential Exposure
        ===================================================
        Service accounts for automation pipelines (svc_cicd, svc_ansible, svc_terraform)
        typically store credentials in:
          - Environment variables
          - Pipeline configuration files
          - Vault/secret manager (misconfigured if accessible)
          - Pipeline logs (exposed build output)

        Common CI/CD credential locations:
          Jenkins: $JENKINS_HOME/.credentials, ${WORKSPACE}/secrets/
          GitLab CI: .gitlab-ci.yml variables (if not masked)
          Ansible: inventory files, group_vars/all.yml, vault
          Terraform: terraform.tfstate (stores provider credentials in plaintext!)

        Lab simulation:
          svc_ansible / svc_terraform accounts have AD access
          Their passwords could appear in ansible.cfg, inventory.ini,
          or terraform provider blocks in world-readable paths.
