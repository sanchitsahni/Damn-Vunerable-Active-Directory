---
# ==============================================================================
# EMPIRE Ansible Inventory
# Multi-Forest Active Directory Lab
# ==============================================================================

all:
  vars:
    ansible_user: Administrator
    ansible_password: "SithLord123!"
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_winrm_port: 5985
    ansible_winrm_scheme: http
    ansible_winrm_server_cert_validation: ignore
    # Generous timeouts: with 3 DCs promoting in parallel + 9 VMs settling, a
    # single WinRM op (win_feature/DISM state check, DCPromo, ACL writes) can take
    # minutes. read_timeout MUST be > operation_timeout, or pywinrm reports a slow
    # op as "Read timed out" / UNREACHABLE. 180 s was too short under load.
    ansible_winrm_operation_timeout_sec: 250
    ansible_winrm_read_timeout_sec: 600
    # Long-running async tasks (DC promotion / Install-ADDSForest) on a busy or
    # low-RAM Server Core box can take >5 s just to signal the async job started.
    # The default win_async_startup_timeout (5 s) then fails the task. Bump it.
    ansible_win_async_startup_timeout: 180

  children:
    # =========================================================================
    # All Domain Controllers
    # =========================================================================
    all_dcs:
      hosts:
        coruscant.empire.local:
          ansible_host: 10.10.0.10
          # empire.local DC-specific vars (used by ad_domain role)
          ad_domain: empire.local
          ad_netbios: EMPIRE
          ad_hostname: coruscant
          ad_static_ip: 10.10.0.10
          ad_subnet_mask: 255.255.0.0
          ad_gateway: 10.10.0.1

        deathstar.eu.empire.local:
          ansible_host: 10.10.0.11
          # After child-domain promotion this box has no usable local admin and
          # eu's own Administrator pw is unreliable — authenticate as the forest
          # Enterprise Admin (EMPIRE\Administrator), which has rights on the child DC
          # for every play (promotion reconnect, trusts, vuln roles).
          ansible_user: "EMPIRE\\Administrator"
          ansible_password: "SithLord123!"
          # child_domain role vars
          child_domain: eu.empire.local
          child_domain_shortname: eu
          parent_domain: empire.local

        yavin4.rebel.local:
          ansible_host: 10.10.20.10
          # rebel.local uses ad_domain role with overridden vars
          ad_domain: rebel.local
          ad_netbios: REBEL
          ad_hostname: coruscant-FIN
          ad_static_ip: 10.10.20.10
          ad_subnet_mask: 255.255.0.0
          ad_gateway: 10.10.0.1

        neimoidia.trade.corp:
          ansible_host: 10.10.30.10
          # trade.corp uses ad_domain role with overridden vars
          ad_domain: trade.corp
          ad_netbios: TRADE
          ad_hostname: coruscant-TRADE
          ad_static_ip: 10.10.30.10
          ad_subnet_mask: 255.255.0.0
          ad_gateway: 10.10.0.1

    # =========================================================================
    # empire.local Member Servers
    # =========================================================================
    corp_servers:
      hosts:
        endor.empire.local:
          ansible_host: 10.10.0.12
        scarif.empire.local:
          ansible_host: 10.10.0.13
        kamino.empire.local:
          ansible_host: 10.10.0.14

    # =========================================================================
    # empire.local Workstations
    # =========================================================================
    corp_workstation:
      hosts:
        tatooine.empire.local:
          ansible_host: 10.10.0.100

    # =========================================================================
    # All member servers (non-DCs) — used by domain_join play in site.yml
    # =========================================================================
    member_servers:
      children:
        corp_servers:
        corp_workstation:

    # =========================================================================
    # Linux member(s) — Ubuntu 22.04 domain-joined box (Linux-in-AD surface).
    # SSH/become, NOT WinRM. Connection vars override the all: WinRM defaults.
    # =========================================================================
    linux_hosts:
      vars:
        ansible_connection: ssh
        ansible_user: labadmin
        ansible_ssh_private_key_file: "{{ playbook_dir }}/../../vms/linux01_id"
        ansible_python_interpreter: /usr/bin/python3
        ansible_become: true
        ansible_become_method: sudo
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      hosts:
        mandalore.empire.local:
          ansible_host: 10.10.0.15
