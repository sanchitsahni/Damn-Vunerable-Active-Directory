---
# ==============================================================================
# DVAD site.yml — Master Playbook
#
# Dependency order:
#   1. corp.local DC must be fully promoted before child/finance/root DCs
#   2. All DCs must be up before trusts are configured
#   3. All DCs must be up before DNS forwarders are set
#   4. DCs must be reachable (LDAP) before member servers join
#
# Usage:
#   ansible-playbook -i inventory.yml playbooks/site.yml
#   ansible-playbook -i inventory.yml playbooks/site.yml --tags ad_domain
#   ansible-playbook -i inventory.yml playbooks/site.yml --limit dc01.corp.local
# ==============================================================================

# ============================================================================
# Phase 1: Promote the 3 INDEPENDENT forest-root DCs IN PARALLEL.
# corp.local, finance.local and root.corp are separate forests with no
# dependency on each other, so they promote simultaneously (strategy: free)
# instead of one-at-a-time — ~3x faster than separate sequential plays.
# Per-host vars (ad_domain/netbios/hostname/static_ip/subnet/gateway) come from
# inventory.yml host_vars; the rest from the ad_domain role defaults.
# ============================================================================
- name: Phase 1 — Promote forest-root DCs (corp + finance + root, parallel)
  hosts:
    - dc01.corp.local
    - dc01.finance.local
    - dc01.root.corp
  strategy: free
  gather_facts: false
  tags:
    - ad_domain
    - forest_roots
    - phase1
  roles:
    - role: ad_domain

# ============================================================================
# Phase 2: Promote dc01.eu.corp.local (child domain).
# Must run AFTER Phase 1 — corp.local LDAP must be up first.
# ============================================================================
- name: Phase 2 — Promote eu.corp.local child DC
  hosts: dc01.eu.corp.local
  gather_facts: false
  tags:
    - child_domain
    - eu_dc
    - phase2
  roles:
    - role: child_domain

# ============================================================================
# Phase 5: Join member servers to corp.local
# Requires Phase 1 complete (corp.local LDAP must answer).
# ============================================================================
- name: Phase 5 — Join member servers to corp.local
  hosts: member_servers
  gather_facts: false
  tags:
    - domain_join
    - member_servers
    - phase5
  roles:
    - role: domain_join
      vars:
        domain_to_join: corp.local
        domain_user: Administrator
        domain_password: "DVADlab2024!"
        domain_netbios: CORP
        domain_dns_ip: 10.10.0.10
        member_subnet_mask: 255.255.0.0
        member_gateway: 10.10.0.1

# ============================================================================
# Phase 6: Configure cross-forest trusts
# Requires Phases 1, 3, 4 complete (all forest DCs up).
# Run against dc01.corp.local — it initiates both trusts.
# ============================================================================
- name: Phase 6 — Configure cross-forest trusts
  hosts: dc01.corp.local
  gather_facts: false
  tags:
    - ad_trust
    - trusts
    - phase6
  roles:
    - role: ad_trust

# ============================================================================
# Phase 7: Configure DNS forwarders on all DCs
# Requires all DCs to be promoted (Phases 1–4).
# ============================================================================
- name: Phase 7 — Configure DNS conditional forwarders on all DCs
  hosts: all_dcs
  gather_facts: false
  tags:
    - dns
    - phase7
  roles:
    - role: dns

# ============================================================================
# Phase 8: Core vulnerability injection — users, ACLs, Kerberos misconfigs
# These roles populate the fundamental AD attack surface (existing roles).
# Requires Phases 1–7 complete.
# ============================================================================
- name: Phase 8 — Core credential and Kerberos vulnerability injection (all DCs)
  hosts: all_dcs
  gather_facts: false
  tags:
    - vuln_core
    - phase8
  roles:
    - role: vuln_cred_access
    # Kerberoast/AS-REP/delegation targets (svc_printer/svc_dwight/svc_creed,
    # FILE01/WS01) exist only in corp.local — the role header says "Target:
    # dc01.corp.local". Scope it so it does not fail on the finance/root/eu DCs.
    - role: vuln_kerberos
      when: inventory_hostname == 'dc01.corp.local'
    - role: vuln_forest

- name: Phase 8b — ADCS vulnerability injection (ca01)
  hosts: ca01.corp.local
  gather_facts: false
  tags:
    - vuln_adcs
    - phase8
  roles:
    - role: vuln_adcs

# ============================================================================
# Phase 9: Initial access surfaces (workstations + member servers)
# Phishing files, weak services, NLA-disabled RDP, IIS/WebDAV.
# ============================================================================
- name: Phase 9 — Initial access surfaces (all hosts)
  hosts: all:!linux_hosts   # Windows-only roles — exclude the Linux member
  gather_facts: false
  tags:
    - vuln_ia
    - phase9
  roles:
    - role: vuln_ia_surface

# ============================================================================
# Phase 10: Lateral movement + persistence + privilege escalation (original roles)
# ============================================================================
- name: Phase 10 — Lateral movement, persistence, privesc (all hosts)
  hosts: all:!linux_hosts   # Windows-only roles — exclude the Linux member
  gather_facts: false
  tags:
    - vuln_lateral
    - vuln_persistence
    - vuln_privesc
    - phase10
  roles:
    - role: vuln_lateral
    - role: vuln_persistence
    - role: vuln_privesc
    - role: vuln_recon

# ============================================================================
# Phase 11: Modern CVE surfaces (2025/2026)
# All other extended surfaces are now absorbed into base roles (phases 8-10).
# ============================================================================
- name: Phase 11 — Modern CVE surfaces 2025/2026 (all DCs + ws01)
  hosts:
    - all_dcs
    - ws01.corp.local
  gather_facts: false
  tags:
    - vuln_cve
    - phase11
  roles:
    - role: vuln_cve

# ============================================================================
# Phase 13: Service expansion — SQL, SCCM, WSUS, Exchange
# ============================================================================
- name: Phase 13 — Service attack surfaces (sql01 + file01 + dc01)
  hosts:
    - sql01.corp.local
    - file01.corp.local
    - dc01.corp.local
  gather_facts: false
  tags:
    - vuln_exchange
    - vuln_srv
    - phase13
  roles:
    - role: vuln_exchange

# ============================================================================
# Phase 14: Cloud/Entra hybrid + defense evasion surfaces
# ============================================================================
- name: Phase 14a — Entra/AAD hybrid attack surfaces (dc01)
  hosts: dc01.corp.local
  gather_facts: false
  tags:
    - vuln_cloud_entra
    - vuln_clo
    - phase14
  roles:
    - role: vuln_cloud_entra

- name: Phase 14b — Defense evasion surfaces (ws01 + file01 + dc01)
  hosts:
    - ws01.corp.local
    - file01.corp.local
    - dc01.corp.local
  gather_facts: false
  tags:
    - vuln_defense_evasion
    - vuln_def
    - phase14
  roles:
    - role: vuln_defense_evasion

# ============================================================================
# Phase 15: Web application attack surfaces (file01 + dc01)
# ============================================================================
- name: Phase 16 — Web application vulnerabilities (file01 + dc01)
  hosts:
    - file01.corp.local
    - dc01.corp.local
  gather_facts: false
  tags:
    - vuln_web_apps
    - vuln_web
    - phase16
  roles:
    - role: vuln_web_apps

# ============================================================================
# Phase 17: Victim traffic simulation (ws01)
# Deploys three scheduled tasks (pam.beesly, jim.halpert, dwight.schrute) that
# open SMB shares every 30 s — real hosts for ntlmrelayx, fake hostnames for
# LLMNR/Responder NTLMv2 capture.  Must run AFTER domain_join so user accounts
# and domain trust are in place.
# ============================================================================
- name: Phase 17 — Victim traffic simulation (ws01)
  hosts: ws01.corp.local
  gather_facts: false
  tags:
    - vuln_traffic_sim
    - traffic_sim
    - phase17
  roles:
    - role: vuln_traffic_sim

# ============================================================================
# Phase 18: Network-protocol attack surfaces (WPAD, mDNS, TFTP, IPv6, NTP,
# NetBIOS, DNS dynamic-update). Headless, segment-reachable from 10.10.0.1.
# ============================================================================
- name: Phase 18 — Network-protocol attack surfaces
  hosts:
    - dc01.corp.local
    - ca01.corp.local
    - file01.corp.local
    - sql01.corp.local
    - ws01.corp.local
  gather_facts: false
  tags:
    - vuln_network_protocols
    - phase18
  roles:
    - role: vuln_network_protocols

# ============================================================================
# Phase 19: Victim-executor simulation (ws01) — scheduled tasks act as gullible
# employees every ~30 s: execute artifacts dropped in the world-writable Drop
# share and touch .library-ms/.search-ms/.url coercion files so outbound NTLM
# fires for Responder/ntlmrelayx. Makes client-side techniques solvable
# HEADLESSLY on Server Core. Runs AFTER domain_join + the phishing/coercion
# drop roles (Phases 9-11) so artifacts exist.
# ============================================================================
- name: Phase 19 — Victim-executor simulation (ws01)
  hosts: ws01.corp.local
  gather_facts: false
  tags:
    - vuln_victim_exec
    - victim_exec
    - phase19
  roles:
    - role: vuln_victim_exec

# (Earlier extended surfaces absorbed into vuln_cred_access, vuln_lateral, vuln_forest in phases 8-10)

# ============================================================================
# Phase 20: Linux-in-AD member (linux01) — domain join + Linux-local privesc
# + Linux→Windows lateral surface + non-Windows network/app services.
# SSH/become (NOT WinRM). MUST run AFTER Phase 1 (corp.local DC promoted) so
# realmd/adcli can join corp.local (DC 10.10.0.10). gather_facts: true — Linux
# facts are cheap and the role uses ansible_distribution / service facts.
# ============================================================================
- name: Phase 20 — Linux member (linux01) — domain join, LPE, services, flags
  hosts: linux_hosts
  gather_facts: true
  become: true
  tags:
    - vuln_linux
    - linux
    - phase20
  roles:
    - role: vuln_linux
